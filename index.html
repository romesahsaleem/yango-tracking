<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Yango Tracking</title>

<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html,
body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  font-family: Arial, Helvetica, sans-serif;
  background: #fff;
  color: #111;
}

/* MAP */
#map {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 1;
}

/* LOGO */
.logo {
  position: fixed;
  top: 18px;
  left: 18px;
  z-index: 1000;
  background: #fff;
  padding: 9px 14px;
  border-radius: 10px;
  box-shadow: 0 3px 15px rgba(0,0,0,.16);
  font-size: 26px;
  font-weight: 900;
  color: #e31837;
  letter-spacing: -1px;
}

/* LOCATION BUTTON */
.location-btn {
  position: fixed;
  right: 18px;
  top: 18px;
  z-index: 1000;
  width: 46px;
  height: 46px;
  border: none;
  border-radius: 50%;
  background: #fff;
  box-shadow: 0 3px 15px rgba(0,0,0,.16);
  cursor: pointer;
  font-size: 20px;
}

/* CAR */
.car-marker {
  width: 48px;
  height: 48px;
  border-radius: 50%;
  background: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 4px 14px rgba(0,0,0,.25);
  border: 3px solid #e31837;
}

.car-marker svg {
  width: 30px;
  height: 30px;
}

/* PICKUP / DROPOFF */
.point-marker {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #fff;
  box-shadow: 0 3px 12px rgba(0,0,0,.25);
  border: 2px solid #111;
}

.point-marker.pickup {
  border-color: #16a34a;
}

.point-marker.dropoff {
  border-color: #e31837;
}

.point-marker svg {
  width: 19px;
  height: 19px;
}

/* BOTTOM SHEET */
.bottom-sheet {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 900;
  background: #fff;
  border-radius: 22px 22px 0 0;
  box-shadow: 0 -5px 25px rgba(0,0,0,.18);
  height: 52vh;
  min-height: 390px;
  max-height: 680px;
  overflow-y: auto;
  padding-bottom: 25px;
}

/* STATUS */
.status-header {
  padding: 18px 20px 8px;
}

.status-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
}

.status-title {
  font-size: 21px;
  font-weight: 800;
}

.status-badge {
  padding: 7px 11px;
  border-radius: 20px;
  background: #f1f1f1;
  font-size: 12px;
  font-weight: 700;
  white-space: nowrap;
}

.status-badge.live {
  background: #dcfce7;
  color: #166534;
}

.status-badge.completed {
  background: #fee2e2;
  color: #991b1b;
}

/* ETA */
.eta {
  padding: 3px 20px 16px;
  font-size: 16px;
  color: #555;
}

.eta strong {
  color: #111;
}

/* SECTION */
.section-title {
  padding: 0 20px 10px;
  font-size: 13px;
  color: #777;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .7px;
}

/* RIDE DETAILS */
.ride-details {
  margin: 0 20px 18px;
  border: 1px solid #eee;
  border-radius: 15px;
  overflow: hidden;
}

.ride-row {
  display: flex;
  align-items: flex-start;
  gap: 13px;
  padding: 14px;
  border-bottom: 1px solid #eee;
}

.ride-row:last-child {
  border-bottom: none;
}

.ride-icon {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

.ride-icon.pickup {
  background: #dcfce7;
  color: #15803d;
}

.ride-icon.dropoff {
  background: #fee2e2;
  color: #dc2626;
}

.ride-content {
  min-width: 0;
}

.ride-label {
  font-size: 11px;
  color: #888;
  margin-bottom: 3px;
  text-transform: uppercase;
}

.ride-value {
  font-size: 16px;
  font-weight: 700;
  word-break: break-word;
}

/* DRIVER */
.driver-card {
  margin: 0 20px 18px;
  padding: 15px;
  border: 1px solid #eee;
  border-radius: 15px;
  display: flex;
  align-items: center;
  gap: 14px;
}

.driver-photo {
  width: 58px;
  height: 58px;
  border-radius: 50%;
  object-fit: cover;
  background: #eee;
  flex-shrink: 0;
}

.driver-name {
  font-size: 21px;
  font-weight: 800;
}

.driver-rating {
  margin-top: 4px;
  font-size: 13px;
  color: #666;
}

.driver-rating span {
  color: #f59e0b;
  font-weight: 800;
}

/* INFO GRID */
.info-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
  margin: 0 20px 18px;
}

.info-box {
  border: 1px solid #eee;
  border-radius: 13px;
  padding: 13px;
}

.info-label {
  color: #888;
  font-size: 11px;
  margin-bottom: 5px;
  text-transform: uppercase;
}

.info-value {
  font-size: 18px;
  font-weight: 800;
  word-break: break-word;
}

/* SHARE */
.share-btn {
  width: calc(100% - 40px);
  margin: 0 20px 12px;
  border: none;
  border-radius: 13px;
  background: #111;
  color: #fff;
  padding: 15px;
  font-size: 16px;
  font-weight: 800;
  cursor: pointer;
}

.share-btn:active {
  transform: scale(.98);
}

/* COMPLETED */
.completed-box {
  display: none;
  margin: 0 20px 18px;
  padding: 15px;
  border-radius: 13px;
  background: #fef2f2;
  color: #991b1b;
  text-align: center;
  font-weight: 700;
}

.completed-box.show {
  display: block;
}

/* MOBILE */
@media (max-width: 600px) {

  .logo {
    top: 12px;
    left: 12px;
    font-size: 22px;
    padding: 8px 12px;
  }

  .location-btn {
    top: 12px;
    right: 12px;
  }

  .bottom-sheet {
    height: 52vh;
    min-height: 390px;
  }

  .status-header {
    padding: 15px 16px 8px;
  }

  .eta {
    padding-left: 16px;
    padding-right: 16px;
  }

  .section-title {
    padding-left: 16px;
    padding-right: 16px;
  }

  .ride-details,
  .driver-card,
  .info-grid {
    margin-left: 16px;
    margin-right: 16px;
  }

  .share-btn {
    width: calc(100% - 32px);
    margin-left: 16px;
    margin-right: 16px;
  }

  .completed-box {
    margin-left: 16px;
    margin-right: 16px;
  }
}
</style>
</head>

<body>

<div id="map"></div>

<div class="logo">YANGO</div>

<button class="location-btn" id="locationBtn" title="My location">
  ⌖
</button>

<div class="bottom-sheet">

  <div class="status-header">
    <div class="status-row">
      <div class="status-title" id="statusTitle">
        Driver is on the way
      </div>

      <div class="status-badge live" id="statusBadge">

      </div>
    </div>
  </div>

  <div class="eta" id="etaText">
    Calculating estimated arrival...
  </div>

  <div class="section-title">
    Ride details
  </div>

  <div class="ride-details">

    <div class="ride-row">
      <div class="ride-icon pickup">
        <svg viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="4"></circle>

      </div>

    <div class="ride-row">
      <div class="ride-icon dropoff">
        <svg viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2">
          <path d="M12 21s7-6.1 7-12a7 7 0 1 0-14 0c0 5.9 7 12 7 12Z"></path>
          <circle cx="12" cy="9" r="2.5"></circle>
        </svg>
      </div>

      <div class="ride-content">
        <div class="ride-label">Drop-off</div>
        <div class="ride-value" id="dropoffText">
          Loading...
        </div>
      </div>
    </div>

  </div>

  <div class="section-title">
    Your driver
  </div>

  <div class="driver-card">

    <img
      id="driverPhoto"
      class="driver-photo"
      src=""
      alt="Driver"
    >

    <div>
      <div class="driver-name" id="driverName">
        Driver
      </div>

      <div class="driver-rating">
        ★ <span id="driverRating">5.0</span>
      </div>
    </div>

  </div>

  <div class="info-grid">

    <div class="info-box">
      <div class="info-label">Vehicle</div>
      <div class="info-value" id="vehicleText">
        —
      </div>
    </div>

    <div class="info-box">
      <div class="info-label">Plate</div>
      <div class="info-value" id="plateText">
        —
      </div>
    </div>

  </div>

  <div class="completed-box" id="completedBox">
    ✓ This trip has been completed.
  </div>

  <button class="share-btn" id="shareBtn">
    Share Tracking
  </button>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script type="module">

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";

import {
  getDatabase,
  ref,
  onValue
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js";


/* =========================
   FIREBASE CONFIG
========================= */

const firebaseConfig = {

  apiKey: "AIzaSyCEaUviM45cSPcs8Te6G0PqsE5imFR2TYE",

  authDomain:
    "yango-tracking.firebaseapp.com",

  projectId:
    "yango-tracking",

  storageBucket:
    "yango-tracking.firebasestorage.app",

  messagingSenderId:
    "1019473211995",

  appId:
    "1:1019473211995:web:56a81d2fc43cda8dd5857e",

  databaseURL:
    "https://yango-tracking-default-rtdb.asia-southeast1.firebasedatabase.app"

};


const app = initializeApp(firebaseConfig);

const database = getDatabase(app);


/* =========================
   TRIP ID
========================= */

const urlParams =
  new URLSearchParams(window.location.search);

const tripId =
  urlParams.get("trip") || "demo";


/* =========================
   MAP
========================= */

const map =
  L.map("map", {
    zoomControl: false
  }).setView(
    [24.8607, 67.0011],
    13
  );


L.tileLayer(
  "https://tile.openstreetmap.org/{z}/{x}/{y}.png",
  {
    attribution:
      '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank">OpenStreetMap contributors</a>',

    maxZoom: 19,

    updateWhenZooming: false,

    updateWhenIdle: true,

    referrerPolicy:
      "strict-origin-when-cross-origin"
  }
).addTo(map);


/* =========================
   VARIABLES
========================= */

let carMarker = null;

let pickupMarker = null;

let dropoffMarker = null;

let routeLine = null;

let firstLocation = true;

let currentDriverLocation = null;

let pickupLocation = null;

let dropoffLocation = null;

let currentStatus = "";


/* =========================
   CAR ICON
========================= */

const carIcon =
  L.divIcon({

    className: "",

    html: `
      <div class="car-marker">

        <svg
          viewBox="0 0 64 64"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
        >

          <path
            d="M16 39L20 23C20.7 20.2 23.2 18 26.1 18H37.9C40.8 18 43.3 20.2 44 23L48 39"
            fill="#e31837"
          />

          <rect
            x="11"
            y="31"
            width="42"
            height="20"
            rx="6"
            fill="#e31837"
          />

          <rect
            x="21"
            y="22"
            width="22"
            height="12"
            rx="3"
            fill="#ffffff"
          />

          <circle
            cx="20"
            cy="49"
            r="5"
            fill="#111"
          />

          <circle
            cx="44"
            cy="49"
            r="5"
            fill="#111"
          />

          <rect
            x="15"
            y="37"
            width="7"
            height="4"
            rx="2"
            fill="#fff"
          />

          <rect
            x="42"
            y="37"
            width="7"
            height="4"
            rx="2"
            fill="#fff"
          />

        </svg>

      </div>
    `,

    iconSize: [48, 48],

    iconAnchor: [24, 24]
  });


/* =========================
   PICKUP ICON
========================= */

const pickupIcon =
  L.divIcon({

    className: "",

    html: `
      <div class="point-marker pickup">

        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >

          <circle
            cx="12"
            cy="12"
            r="4"
          ></circle>

          <path
            d="M12 2v4M12 18v4M2 12h4M18 12h4"
          ></path>

        </svg>

      </div>
    `,

    iconSize: [32, 32],

    iconAnchor: [16, 16]
  });


/* =========================
   DROPOFF ICON
========================= */

const dropoffIcon =
  L.divIcon({

    className: "",

    html: `
      <div class="point-marker dropoff">

        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >

          <path
            d="M12 21s7-6.1 7-12a7 7 0 1 0-14 0c0 5.9 7 12 7 12Z"
          ></path>

          <circle
            cx="12"
            cy="9"
            r="2.5"
          ></circle>

        </svg>

      </div>
    `,

    iconSize: [32, 32],

    iconAnchor: [16, 16]
  });


/* =========================
   CREATE / MOVE CAR
========================= */

function animateCarTo(
  lat,
  lng
) {

  currentDriverLocation = [
    lat,
    lng
  ];

  if (!carMarker) {

    carMarker =
      L.marker(
        [lat, lng],
        {
          icon: carIcon,
          zIndexOffset: 1000
        }
      ).addTo(map);

    return;
  }


  const start =
    carMarker.getLatLng();


  const end =
    L.latLng(
      lat,
      lng
    );


  const duration = 800;

  const startTime =
    performance.now();


  function animate(
    currentTime
  ) {

    const progress =
      Math.min(
        (currentTime - startTime) /
        duration,
        1
      );


    const eased =
      progress *
      (2 - progress);


    const newLat =
      start.lat +
      (end.lat - start.lat) *
      eased;


    const newLng =
      start.lng +
      (end.lng - start.lng) *
      eased;


    carMarker.setLatLng([
      newLat,
      newLng
    ]);


    if (progress < 1) {

      requestAnimationFrame(
        animate
      );

    } else {

      updateMapRoute();

    }
  }


  requestAnimationFrame(
    animate
  );
}


/* =========================
   PICKUP
========================= */

function updatePickup(
  lat,
  lng
) {

  pickupLocation = [
    lat,
    lng
  ];


  if (!pickupMarker) {

    pickupMarker =
      L.marker(
        [lat, lng],
        {
          icon: pickupIcon
        }
      ).addTo(map);

  } else {

    pickupMarker.setLatLng([
      lat,
      lng
    ]);

  }

  updateMapRoute();
}


/* =========================
   DROPOFF
========================= */

function updateDropoff(
  lat,
  lng
) {

  dropoffLocation = [
    lat,
    lng
  ];


  if (!dropoffMarker) {

    dropoffMarker =
      L.marker(
        [lat, lng],
        {
          icon: dropoffIcon
        }
      ).addTo(map);

  } else {

    dropoffMarker.setLatLng([
      lat,
      lng
    ]);

  }

  updateMapRoute();
}


/* =========================
   DISTANCE
========================= */

function calculateDistance(
  lat1,
  lng1,
  lat2,
  lng2
) {

  const R =
    6371;

  const dLat =
    (lat2 - lat1) *
    Math.PI / 180;

  const dLng =
    (lng2 - lng1) *
    Math.PI / 180;


  const a =
    Math.sin(dLat / 2) *
    Math.sin(dLat / 2) +

    Math.cos(
      lat1 *
      Math.PI / 180
    ) *

    Math.cos(
      lat2 *
      Math.PI / 180
    ) *

    Math.sin(dLng / 2) *
    Math.sin(dLng / 2);


  const c =
    2 *
    Math.atan2(
      Math.sqrt(a),
      Math.sqrt(1 - a)
    );


  return R * c;
}


/* =========================
   ETA
========================= */

function updateETA() {

  if (
    !currentDriverLocation
  ) {

    document.getElementById(
      "etaText"
    ).textContent =
      "Waiting for driver's location...";

    return;
  }


  let destination = null;


  if (
    currentStatus ===
    "Trip started"
  ) {

    destination =
      dropoffLocation;

  } else {

    destination =
      pickupLocation;

  }


  if (!destination) {

    document.getElementById(
      "etaText"
    ).textContent =
      "Location information unavailable.";

    return;
  }


  const distance =
    calculateDistance(
      currentDriverLocation[0],
      currentDriverLocation[1],
      destination[0],
      destination[1]
    );


  const averageSpeed =
    currentStatus ===
    "Trip started"
      ? 30
      : 25;


  const minutes =
    Math.max(
      1,
      Math.round(
        distance /
        averageSpeed *
        60
      )
    );


  document.getElementById(
    "etaText"
  ).innerHTML =
    `<strong>${minutes} min</strong> estimated arrival • ${distance.toFixed(1)} km`;
}


/* =========================
   ROUTE DESTINATION
========================= */

function getRouteDestination() {

  if (
    currentStatus ===
    "Trip started"
  ) {

    return dropoffLocation;

  }

  return pickupLocation;
}


/* =========================
   ROUTE
========================= */

async function updateMapRoute() {

  if (
    !currentDriverLocation
  ) {

    return;
  }


  const destination =
    getRouteDestination();


  if (!destination) {

    return;
  }


  const from =
    currentDriverLocation;


  const to =
    destination;


  const url =
    `https://router.project-osrm.org/route/v1/driving/${from[1]},${from[0]};${to[1]},${to[0]}?overview=full&geometries=geojson`;


  try {

    const response =
      await fetch(url);


    const data =
      await response.json();


    if (
      !data.routes ||
      !data.routes.length
    ) {

      return;
    }


    const coordinates =
      data.routes[0]
        .geometry
        .coordinates
        .map(
          point => [
            point[1],
            point[0]
          ]
        );


    if (routeLine) {

      map.removeLayer(
        routeLine
      );

    }


    routeLine =
      L.polyline(
        coordinates,
        {
          color: "#fff",
          weight: 8,
          opacity: .95
        }
      ).addTo(map);


    const yellowLine =
      L.polyline(
        coordinates,
        {
          color: "#facc15",
          weight: 4,
          opacity: 1
        }
      ).addTo(map);


    routeLine.yellowLine =
      yellowLine;


    updateETA();

  } catch (error) {

    console.error(
      "Route error:",
      error
    );

    updateETA();

  }
}


/* =========================
   STATUS
========================= */

function updateStatus(
  status
) {

  currentStatus =
    status ||
    "Driver is on the way";


  const title =
    document.getElementById(
      "statusTitle"
    );

  const badge =
    document.getElementById(
      "statusBadge"
    );


  title.textContent =
    currentStatus;


  badge.classList.remove(
    "live",
    "completed"
  );


  if (
    currentStatus ===
    "Trip completed"
  ) {

    badge.textContent =
      "COMPLETED";

    badge.classList.add(
      "completed"
    );


    document
      .getElementById(
        "completedBox"
      )
      .classList.add(
        "show"
      );

  } else {

    badge.textContent =
      "LIVE";

    badge.classList.add(
      "live"
    );

    document
      .getElementById(
        "completedBox"
      )
      .classList.remove(
        "show"
      );
  }


  updateETA();
}


/* =========================
   DRIVER INFO
========================= */

function updateInformation(
  trip
) {

  document.getElementById(
    "pickupText"
  ).textContent =
    trip.pickup ||
    "Pickup location";


  document.getElementById(
    "dropoffText"
  ).textContent =
    trip.dropoff ||
    "Drop-off location";


  document.getElementById(
    "driverName"
  ).textContent =
    trip.driverName ||
    "Driver";


  document.getElementById(
    "driverRating"
  ).textContent =
    trip.rating ||
    "5.0";


  document.getElementById(
    "vehicleText"
  ).textContent =
    trip.vehicle ||
    "—";


  document.getElementById(
    "plateText"
  ).textContent =
    trip.plate ||
    "—";


  const photo =
    document.getElementById(
      "driverPhoto"
    );


  if (
    trip.driverPhoto
  ) {

    photo.src =
      trip.driverPhoto;

  } else {

    photo.src =
      "data:image/svg+xml;charset=UTF-8," +
      encodeURIComponent(`
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="100"
          height="100"
          viewBox="0 0 100 100"
        >

          <circle
            cx="50"
            cy="50"
            r="50"
            fill="#eeeeee"
          />

          <circle
            cx="50"
            cy="38"
            r="17"
            fill="#999999"
          />

          <path
            d="M20 88c4-20 18-30 30-30s26 10 30 30"
            fill="#999999"
          />

        </svg>
      `);

  }
}


/* =========================
   FIREBASE REALTIME LISTENER
========================= */

const tripRef =
  ref(
    database,
    `trips/${tripId}`
  );


onValue(
  tripRef,
  snapshot => {

    const trip =
      snapshot.val();


    if (!trip) {

      document.getElementById(
        "statusTitle"
      ).textContent =
        "Trip not found";

      document.getElementById(
        "statusBadge"
      ).textContent =
        "ERROR";

      document.getElementById(
        "statusBadge"
      ).classList.remove(
        "live"
      );

      return;
    }


    updateInformation(
      trip
    );


    updateStatus(
      trip.status
    );


    if (
      trip.pickupLat != null &&
      trip.pickupLng != null
    ) {

      updatePickup(
        Number(trip.pickupLat),
        Number(trip.pickupLng)
      );

    }


    if (
      trip.dropoffLat != null &&
      trip.dropoffLng != null
    ) {

      updateDropoff(
        Number(trip.dropoffLat),
        Number(trip.dropoffLng)
      );

    }


    if (
      trip.location &&
      trip.location.lat != null &&
      trip.location.lng != null
    ) {

      const lat =
        Number(
          trip.location.lat
        );


      const lng =
        Number(
          trip.location.lng
        );


      if (
        !Number.isFinite(lat) ||
        !Number.isFinite(lng)
      ) {

        return;
      }


      if (
        firstLocation
      ) {

        firstLocation =
          false;


        currentDriverLocation =
          [lat, lng];


        carMarker =
          L.marker(
            [lat, lng],
            {
              icon: carIcon,
              zIndexOffset: 1000
            }
          ).addTo(map);


        map.setView(
          [lat, lng],
          15,
          {
            animate: true
          }
        );


        updateMapRoute();

      } else {

        animateCarTo(
          lat,
          lng
        );

      }

    }

  },

  error => {

    console.error(
      "Firebase error:",
      error
    );

  }
);


/* =========================
   LOCATION BUTTON
========================= */

document.getElementById(
  "locationBtn"
).addEventListener(
  "click",
  () => {

    if (
      currentDriverLocation
    ) {

      map.setView(
        currentDriverLocation,
        16,
        {
          animate: true
        }
      );

    }

  }
);


/* =========================
   SHARE BUTTON
========================= */

document.getElementById(
  "shareBtn"
).addEventListener(
  "click",
  async () => {

    const shareUrl =
      window.location.href;


    if (
      navigator.share
    ) {

      try {

        await navigator.share({

          title:
            "Track my ride",

          text:
            "Track the driver's location in real time.",

          url:
            shareUrl

        });

      } catch (error) {

        console.log(
          "Share cancelled."
        );

      }

    } else {

      try {

        await navigator.clipboard.writeText(
          shareUrl
        );


        alert(
          "Tracking link copied!"
        );

      } catch (error) {

        prompt(
          "Copy this tracking link:",
          shareUrl
        );

      }

    }

  }
);


/* =========================
   MAP RESIZE
========================= */

setTimeout(
  () => {

    map.invalidateSize();

  },
  500
);


window.addEventListener(
  "resize",
  () => {

    map.invalidateSize();

  }
);

</script>
