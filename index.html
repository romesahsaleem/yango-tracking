<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"

               maximum-scale=1.0, user-scalable=no">

<title>Yango Tracking</title>

<link rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>

/* =====================================================
   BASIC
===================================================== */

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  width:100%;
  height:100%;
  margin:0;
  overflow:hidden;

  font-family:
    Arial,
    Helvetica,
    sans-serif;

  background:#f7f7f7;
  color:#202020;
}

#map{
  position:fixed;
  inset:0;
  z-index:1;
}

/* Remove some default map visual clutter */

.leaflet-control-attribution{
  font-size:8px;
  background:rgba(255,255,255,.65)!important;
}

.leaflet-control-zoom{
  display:none;
}


/* =====================================================
   YANGO STYLE WORDMARK
===================================================== */

.brand{
  position:fixed;

  top:26px;
  left:27px;

  z-index:1000;

  color:#e21d2b;

  font-size:39px;
  font-weight:900;

  letter-spacing:-3px;
  line-height:1;

  user-select:none;
}


/* =====================================================
   LOCATION BUTTON
===================================================== */

.location-button{

  position:fixed;

  right:20px;

  bottom:calc(55vh + 17px);

  z-index:1000;

  width:52px;
  height:52px;

  border:0;

  border-radius:50%;

  background:#fff;

  box-shadow:
    0 3px 14px rgba(0,0,0,.20);

  display:flex;

  align-items:center;
  justify-content:center;

  cursor:pointer;
}

.location-button svg{
  width:25px;
  height:25px;
  fill:#242424;
}


/* =====================================================
   CAR MARKER
===================================================== */

.car-marker{

  width:56px;
  height:56px;

  border-radius:50%;

  background:#f6d51d;

  border:4px solid white;

  box-shadow:
    0 3px 12px rgba(0,0,0,.28);

  display:flex;

  align-items:center;
  justify-content:center;
}

.car-marker svg{
  width:39px;
  height:39px;
}


/* =====================================================
   PICKUP / DESTINATION
===================================================== */

.map-point{

  width:36px;
  height:36px;

  border-radius:50%;

  border:3px solid white;

  box-shadow:
    0 2px 9px rgba(0,0,0,.28);

  display:flex;

  align-items:center;
  justify-content:center;

  font-size:17px;

  font-weight:900;

  color:white;
}

.pickup-point{
  background:#e52b34;
}

.destination-point{
  background:#202020;
}


/* =====================================================
   BOTTOM SHEET
===================================================== */

.bottom-sheet{

  position:fixed;

  left:0;
  right:0;
  bottom:0;

  z-index:900;

  height:55vh;

  min-height:430px;

  max-height:720px;

  background:white;

  border-radius:
    28px 28px 0 0;

  box-shadow:
    0 -5px 25px rgba(0,0,0,.16);

  overflow-y:auto;

  overflow-x:hidden;

  -webkit-overflow-scrolling:touch;
}

.bottom-sheet::-webkit-scrollbar{
  width:5px;
}

.bottom-sheet::-webkit-scrollbar-thumb{
  background:#d0d0d0;
  border-radius:20px;
}


/* =====================================================
   HANDLE
===================================================== */

.handle{

  width:40px;
  height:5px;

  margin:
    11px auto 7px;

  border-radius:20px;

  background:#c9c9c9;
}


/* =====================================================
   MAIN RIDE HEADER
===================================================== */

.ride-header{

  padding:
    8px 23px 19px;
}

.ride-status{

  margin:0 0 9px;

  font-size:24px;

  line-height:1.15;

  font-weight:800;

  letter-spacing:-.3px;

  color:#202020;
}

.vehicle-summary{

  display:flex;

  align-items:center;

  gap:9px;

  color:#666;

  font-size:16px;

  font-weight:600;
}

.plate-badge{

  display:inline-flex;

  align-items:center;

  justify-content:center;

  padding:
    5px 9px;

  border-radius:7px;

  background:#eeeeee;

  color:#252525;

  font-size:13px;

  font-weight:800;

  letter-spacing:.5px;
}


/* =====================================================
   SECTION TITLE
===================================================== */

.section-title{

  padding:
    16px 23px;

  background:#f5f5f5;

  border-top:1px solid #ededed;
  border-bottom:1px solid #ededed;

  font-size:19px;

  font-weight:800;

  color:#555;
}


/* =====================================================
   RIDE DETAILS
===================================================== */

.ride-details{

  padding:
    20px 23px 8px;
}

.location-row{

  position:relative;

  display:flex;

  gap:15px;

  min-height:78px;
}

.location-row:last-child{
  min-height:70px;
}

.location-row:first-child::after{

  content:"";

  position:absolute;

  left:17px;

  top:38px;

  height:46px;

  width:2px;

  background:#d3d3d3;
}

.location-icon{

  flex:0 0 36px;

  width:36px;
  height:36px;

  border-radius:50%;

  display:flex;

  align-items:center;
  justify-content:center;

  color:white;

  font-size:15px;

  font-weight:900;

  z-index:2;
}

.pickup-icon{
  background:#e52b34;
}

.destination-icon{
  background:#222;
}

.location-content{
  padding-top:1px;
}

.location-label{

  margin-bottom:5px;

  color:#999;

  font-size:12px;

  text-transform:uppercase;

  letter-spacing:.5px;
}

.location-name{

  max-width:290px;

  font-size:16px;

  line-height:1.3;

  font-weight:600;

  color:#252525;
}


/* =====================================================
   DRIVER
===================================================== */

.driver-box{

  padding:
    20px 23px;

  display:flex;

  align-items:center;

  gap:16px;
}

.driver-photo{

  width:70px;
  height:70px;

  flex:0 0 70px;

  border-radius:50%;

  object-fit:cover;

  background:#eeeeee;
}

.driver-placeholder{

  width:70px;
  height:70px;

  flex:0 0 70px;

  border-radius:50%;

  background:#eeeeee;

  display:flex;

  align-items:center;
  justify-content:center;
}

.driver-placeholder svg{

  width:43px;
  height:43px;

  fill:#1684d8;
}

.driver-name{

  font-size:21px;

  font-weight:800;

  margin-bottom:6px;
}

.rating{

  font-size:15px;

  color:#444;
}

.star{

  color:#f1c400;

  font-size:20px;

  margin-right:5px;
}


/* =====================================================
   VEHICLE INFORMATION
===================================================== */

.vehicle-information{

  padding:
    0 23px 20px;
}

.info-row{

  padding:
    16px 0;

  border-bottom:
    1px solid #ededed;
}

.info-label{

  margin-bottom:6px;

  font-size:13px;

  color:#999;
}

.info-value{

  font-size:17px;

  font-weight:700;

  color:#222;
}


/* =====================================================
   SHARE
===================================================== */

.share-area{

  padding:
    8px 23px 28px;
}

.share-button{

  width:100%;
  height:50px;

  border:0;

  border-radius:14px;

  background:#e52b34;

  color:white;

  font-size:16px;

  font-weight:800;

  cursor:pointer;
}


/* =====================================================
   COMPLETED
===================================================== */

.completed{

  display:none;

  padding:
    25px 23px 35px;

  text-align:center;
}

.completed-icon{

  width:62px;
  height:62px;

  margin:
    0 auto 12px;

  border-radius:50%;

  background:#eeeeee;

  display:flex;

  align-items:center;
  justify-content:center;

  font-size:30px;
}

.completed h2{

  margin:
    0 0 6px;

  font-size:23px;
}

.completed p{

  margin:0;

  color:#777;

  font-size:15px;
}


/* =====================================================
   LOADING
===================================================== */

.loading{

  position:fixed;

  inset:0;

  z-index:3000;

  background:#fff;

  display:flex;

  align-items:center;
  justify-content:center;

  flex-direction:column;

  gap:12px;

  font-size:15px;

  color:#555;
}

.spinner{

  width:35px;
  height:35px;

  border-radius:50%;

  border:
    4px solid #eeeeee;

  border-top-color:#e52b34;

  animation:
    spin .8s linear infinite;
}

@keyframes spin{

  to{
    transform:rotate(360deg);
  }

}


/* =====================================================
   ERROR
===================================================== */

.error{

  position:fixed;

  left:18px;
  right:18px;

  top:75px;

  z-index:2500;

  display:none;

  background:white;

  border-radius:16px;

  padding:18px;

  box-shadow:
    0 5px 25px rgba(0,0,0,.20);
}

.error-title{

  font-weight:800;

  font-size:17px;

  margin-bottom:7px;
}

.error-text{

  color:#666;

  font-size:14px;

  line-height:1.4;

/* =====================================================
   MOBILE
===================================================== */

@media(max-width:600px){

  .brand{

    top:26px;
    left:27px;

    font-size:39px;
  }

  .location-button{

    right:18px;

    bottom:
      calc(55vh + 16px);
  }

}


/* =====================================================
   DESKTOP
===================================================== */

@media(min-width:601px){

  .bottom-sheet{

    width:440px;

    left:50%;

    right:auto;

    transform:
      translateX(-50%);
  }

  .brand{

    left:
      calc(50% - 185px);
  }

  .location-button{

    right:
      calc(50% - 185px);
  }

}

<script type="module">


/* =====================================================

};


const app =
  initializeApp(

  );


const database =
  getDatabase(app);


/* =====================================================
   TRIP ID
===================================================== */

const params =
  new URLSearchParams(
    window.location.search
  );

const tripId =
  params.get("trip") || "demo";


/* =====================================================
   MAP
===================================================== */

const map =
  L.map(
    "map",
    {
      zoomControl:false,
      attributionControl:true
    }
  )
  .setView(
    [24.8607,67.0011],
    14
  );


/*
   CLEAN LIGHT MAP

   Carto Voyager gives a much cleaner,
   lighter road-focused appearance than
   the default OpenStreetMap layer.
*/

L.tileLayer(
  "https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png",
  {
    attribution:
      '&copy; OpenStreetMap contributors &copy; CARTO',

    subdomains:
      "abcd",

    maxZoom:
      20
  }
)
.addTo(map);


/* =====================================================
   VARIABLES
===================================================== */

let carMarker = null;

let pickupMarker = null;

let destinationMarker = null;

let routeLine = null;

let lastRouteRequest = 0;

let lastRouteKey = "";

let firstLocation = true;


/* =====================================================
   CAR ICON
===================================================== */

const carIcon =
  L.divIcon({

/* =====================================================
   MAP POINT ICON
===================================================== */

function pointIcon(
  type
){

  const isPickup =

  return L.divIcon({

/* =====================================================
   VEHICLE NAME
===================================================== */

function vehicleName(
  trip
){

  if(
    trip.vehicle &&
    String(trip.vehicle).trim()
  ){

    return trip.vehicle;

  }


  const parts = [

    trip.vehicleColor,

    trip.vehicleModel

  ]
  .filter(Boolean);


  if(parts.length)
    return parts.join(" ");


  return "Vehicle";

}


/* =====================================================
   SET TEXT
===================================================== */

function text(
  id,
  value,
  fallback="--"
){

  const el =
    document.getElementById(id);


  if(
    value !== undefined &&
    value !== null &&
    String(value).trim()
  ){

    el.textContent =
      value;

  }else{

    el.textContent =
      fallback;

  }

}


/* =====================================================
   HAVERSINE DISTANCE
===================================================== */

function distance(
  a,
  b
){

  const R =
    6371000;

  const p1 =
    a.lat *
    Math.PI /
    180;

  const p2 =
    b.lat *
    Math.PI /
    180;

  const dp =
    (b.lat-a.lat) *
    Math.PI /
    180;

  const dl =
    (b.lng-a.lng) *
    Math.PI /
    180;

  const x =
    Math.sin(dp/2) *
    Math.sin(dp/2) +

    Math.cos(p1) *
    Math.cos(p2) *
    Math.sin(dl/2) *
    Math.sin(dl/2);

  return R *
    2 *
    Math.atan2(
      Math.sqrt(x),
      Math.sqrt(1-x)
    );

}


/* =====================================================
   GET ROUTE DESTINATION
===================================================== */

function routeDestination(
  trip
){

  const status =
    trip.status ||
    "Driver is on the way";


  if(
    status === "Trip started" &&

    trip.dropoffLocation?.lat != null &&
    trip.dropoffLocation?.lng != null
  ){

    return {

      lat:
        Number(
          trip.dropoffLocation.lat
        ),

      lng:
        Number(
          trip.dropoffLocation.lng
        )

    };

  }


  if(
    (
      status ===
      "Driver is on the way"

      ||

      status ===
      "Driver arrived"
    )

    &&

    trip.pickupLocation?.lat != null &&

    trip.pickupLocation?.lng != null
  ){

    return {

      lat:
        Number(
          trip.pickupLocation.lat
        ),

      lng:
        Number(
          trip.pickupLocation.lng
        )

    };

  }


  return null;

}


/* =====================================================
   GET ROAD ROUTE
===================================================== */

async function getRoute(
  trip,
  location
){

  const destination =
    routeDestination(
      trip
    );


  if(!destination)
    return null;


  const key =

    `${location.lat.toFixed(4)},` +

    `${location.lng.toFixed(4)}|` +

    `${destination.lat.toFixed(5)},` +

    `${destination.lng.toFixed(5)}|` +

    `${trip.status}`;


  const now =
    Date.now();


  /*
     Don't constantly request routes.
  */

  if(
    key === lastRouteKey &&
    now-lastRouteRequest < 15000
  ){

    return null;

  }


  lastRouteKey =
    key;

  lastRouteRequest =
    now;


  try{

    const url =

      "https://router.project-osrm.org/route/v1/driving/" +

      `${location.lng},${location.lat};` +

      `${destination.lng},${destination.lat}` +

      "?overview=full&geometries=geojson";


    const response =
      await fetch(url);


    if(!response.ok)
      return null;


    const data =
      await response.json();


    if(
      !data.routes ||
      !data.routes.length
    ){

      return null;

    }


    return data.routes[0];

  }catch(error){

    console.warn(
      "Route request failed",
      error
    );

    return null;

  }

}


/* =====================================================
   DRAW ROUTE
===================================================== */

function drawRoute(
  route
){

  if(!route)
    return;


  const coordinates =

    route.geometry.coordinates
      .map(
        point =>
          [
            point[1],
            point[0]
          ]
      );


  if(routeLine){

    map.removeLayer(
      routeLine
    );

  }


  /*
     Clean route:
     white outer line + yellow inner line.
  */

  const routeOutline =
    L.polyline(
      coordinates,
      {
        color:"#ffffff",
        weight:9,
        opacity:.95,
        lineCap:"round",
        lineJoin:"round"
      }
    )
    .addTo(map);


  const routeInner =
    L.polyline(
      coordinates,
      {
        color:"#e7c900",
        weight:5,
        opacity:1,
        lineCap:"round",
        lineJoin:"round"
      }
    )
    .addTo(map);


  routeLine =
    L.layerGroup([
      routeOutline,
      routeInner
    ])
    .addTo(map);

}


/* =====================================================
   UPDATE MAP
===================================================== */

function updateMap(
  trip,
  location
){

  if(!location)
    return;


  const lat =
    Number(location.lat);

  const lng =
    Number(location.lng);


  if(
    !Number.isFinite(lat) ||
    !Number.isFinite(lng)
  ){

    return;

  }


  const position =
    [lat,lng];


  /* CAR */

  if(!carMarker){

    carMarker =
      L.marker(
        position,
        {
          icon:carIcon,
          zIndexOffset:1000
        }
      )
      .addTo(map);

  }else{

    carMarker.setLatLng(
      position
    );

  }


  /* PICKUP */

  if(
    trip.pickupLocation?.lat != null &&
    trip.pickupLocation?.lng != null
  ){

    const point = [

      Number(
        trip.pickupLocation.lat
      ),

      Number(
        trip.pickupLocation.lng
      )

    ];


    if(!pickupMarker){

      pickupMarker =
        L.marker(
          point,
          {
            icon:
              pointIcon(
                "pickup"
              ),

            zIndexOffset:500
          }
        )
        .addTo(map);

    }else{

      pickupMarker.setLatLng(
        point
      );

    }

  }


  /* DESTINATION */

  if(
    trip.dropoffLocation?.lat != null &&
    trip.dropoffLocation?.lng != null
  ){

    const point = [

      Number(
        trip.dropoffLocation.lat
      ),

      Number(
        trip.dropoffLocation.lng
      )

    ];


    if(!destinationMarker){

      destinationMarker =
        L.marker(
          point,
          {
            icon:
              pointIcon(
                "destination"
              ),

            zIndexOffset:500
          }
        )
        .addTo(map);

    }else{

      destinationMarker.setLatLng(
        point
      );

    }

  }


  /* INITIAL VIEW */

  if(firstLocation){

    map.setView(
      position,
      15
    );

    firstLocation =
      false;

  }

}


/* =====================================================
   UPDATE DRIVER PHOTO
===================================================== */

function updateDriverPhoto(
  photo
){

  const container =
    document.getElementById(
      "driverPhotoContainer"
    );


  if(
    photo &&
    String(photo).trim()
  ){

    container.className =
      "";


    container.innerHTML =

      `<img
        class="driver-photo"
        src="${String(photo)
          .replace(/"/g,"&quot;")}"
        alt="Driver"
        onerror="
          this.parentElement.className='driver-placeholder';

        "
      >`;

  }else{

    container.innerHTML =

      <path d="
      M12 12
      a4.2 4.2 0 1 0

/* =====================================================
   UPDATE RIDE INFORMATION
===================================================== */

function updateRide(
  trip,
  location,
  route
){

  const vehicle =
    vehicleName(
      trip
    );


  /* VEHICLE */

  text(
    "vehicleSummary",
    vehicle,
    "Vehicle"
  );


  text(
    "vehicle",
    vehicle,
    "--"
  );


  /* PLATE */

  text(
    "plateSummary",
    trip.plate,
    "---"
  );


  text(
    "plate",
    trip.plate,
    "--"
  );


  /* LOCATIONS */

  text(
    "pickup",
    trip.pickup,
    "--"
  );


  text(
    "dropoff",
    trip.dropoff,
    "--"
  );


  /* DRIVER */

  text(
    "driverName",
    trip.driverName,
    "Driver"
  );


  text(
    "rating",
    trip.rating,
    "--"
  );


  updateDriverPhoto(
    trip.driverPhoto
  );


  /* =================================================
     ETA
  ================================================= */

  let seconds = null;


  if(
    route &&
    Number.isFinite(
      Number(route.duration)
    )
  ){

    seconds =
      Number(route.duration);

  }


  if(
    seconds === null &&
    location
  ){

    const destination =
      routeDestination(
        trip
      );


    if(destination){

      /*
         Approximate fallback only if
         the routing service hasn't returned yet.
      */

      const metres =
        distance(
          {
            lat:
              Number(location.lat),

            lng:
              Number(location.lng)
          },

          destination
        );


      seconds =
        metres / 8.33;

    }

  }


  /* =================================================
     STATUS
  ================================================= */

  const status =
    trip.status ||
    "Driver is on the way";


  let message;


  if(
    status ===
    "Driver arrived"
  ){

    message =
      "Driver has arrived";

  }

  else if(
    status ===
    "Trip started"
  ){

    if(seconds !== null){

      message =
        `Trip in progress, ${Math.max(
          1,
          Math.round(seconds/60)
        )} min left`;

    }else{

      message =
        "Trip in progress";

    }

  }

  else if(
    status ===
    "Trip completed"
  ){

    message =
      "Trip completed";

  }

  else{

    if(seconds !== null){

      message =
        `Driver on the way, ${Math.max(
          1,
          Math.round(seconds/60)
        )} min left`;

    }else{

      message =
        "Driver on the way";

    }

  }


  document.getElementById(
    "rideStatus"
  )
  .textContent =
    message;


  /* =================================================
     COMPLETED
  ================================================= */

  const completed =
    status ===
    "Trip completed";


  document.getElementById(
    "completed"
  )
  .style.display =
    completed
      ? "block"
      : "none";


  document.getElementById(
    "shareArea"
  )
  .style.display =
    completed
      ? "none"
      : "block";

}


/* =====================================================
   LOCATION BUTTON
===================================================== */

document
  .getElementById(
    "locationButton"
  )
  .addEventListener(
    "click",
    () => {

      if(!carMarker)
        return;


      map.setView(
        carMarker.getLatLng(),
        16,
        {
          animate:true,
          duration:.5
        }
      );

    }
  );


/* =====================================================
   SHARE BUTTON
===================================================== */

document
  .getElementById(
    "shareButton"
  )
  .addEventListener(
    "click",
    async () => {

      const url =
        window.location.href;


      try{

        if(
          navigator.share
        ){

          await navigator.share({

            title:
              "Trip tracking",

            text:
              "Track this trip",

            url:
              url

          });

        }else{

          await navigator.clipboard
            .writeText(
              url
            );

          alert(
            "Tracking link copied."
          );

        }

      }catch(error){

        if(
          error.name !==
          "AbortError"
        ){

          try{

            await navigator.clipboard
              .writeText(
                url
              );

            alert(
              "Tracking link copied."
            );

          }catch(e){

            alert(
              url
            );

          }

        }

      }

    }
  );


/* =====================================================
   FIREBASE REAL-TIME DATA
===================================================== */

onValue(

  ref(
    database,
    "trips/" + tripId
  ),

  async snapshot => {

    const trip =
      snapshot.val();


    if(!trip){

      document.getElementById(
        "loading"
      ).style.display =
        "none";


      document.getElementById(
        "error"
      ).style.display =
        "block";


      document.getElementById(
        "errorText"
      ).textContent =

        `Trip "${tripId}" was not found. Save this trip from the Admin page first.`;


      return;

    }


    document.getElementById(
      "loading"
    ).style.display =
      "none";


    document.getElementById(
      "error"
    ).style.display =
      "none";


    const location =
      trip.location;


    /* MAP */

    updateMap(
      trip,
      location
    );


    /* ROUTE */

    let route = null;


    if(location){

      route =
        await getRoute(
          trip,
          {
            lat:
              Number(location.lat),

            lng:
              Number(location.lng)
          }
        );


      if(route){

        drawRoute(
          route
        );

      }

    }


    /* INFORMATION */

    updateRide(
      trip,
      location,
      route
    );

  }

);


/* =====================================================
   LOADING TIMEOUT
===================================================== */

setTimeout(
  () => {

    const loader =
      document.getElementById(
        "loading"
      );


    if(
      loader.style.display !==
      "none"
    ){

      loader.style.display =
        "none";


      document.getElementById(
        "error"
      ).style.display =
        "block";


      document.getElementById(
        "errorText"
      ).textContent =

        "The ride could not be loaded. Check your Firebase connection and trip ID.";

    }

  },
  12000
);

</script>
