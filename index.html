<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Yango Tracking — Demo</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      overflow: hidden;
      background: #f5f5f5;
    }

    #map {
      width: 100vw;
      height: 100vh;
    }

    .top-bar {
      position: fixed;
      top: 18px;
      left: 18px;
      right: 18px;
      z-index: 1000;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
    }

    .logo {
      background: white;
      padding: 12px 18px;
      border-radius: 14px;
      box-shadow: 0 3px 15px rgba(0,0,0,0.15);
      font-size: 18px;
      font-weight: bold;
      pointer-events: auto;
    }

    .demo {
      font-size: 10px;
      color: #777;
      display: block;
      margin-top: 3px;
    }

    .location-button {
      background: #111;
      color: white;
      border: none;
      padding: 12px 17px;
      border-radius: 12px;
      font-weight: bold;
      cursor: pointer;
      pointer-events: auto;
    }

    .ride-card {
      position: fixed;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      width: min(450px, calc(100% - 30px));
      background: white;
      border-radius: 24px;
      padding: 20px;
      z-index: 1000;
      box-shadow: 0 5px 25px rgba(0,0,0,0.2);
    }

    .status {
      display: flex;
      align-items: center;
      gap: 9px;
      font-size: 14px;
      font-weight: bold;
      margin-bottom: 15px;
    }

    .dot {
      width: 10px;
      height: 10px;
      background: #22c55e;
      border-radius: 50%;
    }

    .driver {
      display: flex;
      align-items: center;
      gap: 13px;
      margin-bottom: 18px;
    }

    .driver-avatar {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: #eee;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 25px;
      overflow: hidden;
    }

    .driver-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .driver-name {
      font-weight: bold;
      font-size: 17px;
    }

    .vehicle {
      color: #777;
      font-size: 13px;
      margin-top: 4px;
    }

    .route {
      border-top: 1px solid #eee;
      padding-top: 13px;
      margin-top: 5px;
      font-size: 13px;
    }

    .route div {
      margin: 7px 0;
    }

    .eta {
      display: flex;
      justify-content: space-between;
      border-top: 1px solid #eee;
      padding-top: 15px;
      margin-top: 12px;
    }

    .eta strong {
      font-size: 21px;
    }

    .eta small {
      color: #777;
    }

    .share {
      width: 100%;
      margin-top: 15px;
      padding: 13px;
      border: none;
      border-radius: 12px;
      background: #f0f0f0;
      font-weight: bold;
      cursor: pointer;
    }

    .gps-message {
      position: fixed;
      top: 80px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      background: white;
      padding: 11px 16px;
      border-radius: 12px;
      box-shadow: 0 3px 15px rgba(0,0,0,0.15);
      font-size: 13px;
      display: none;
    }

    @media (max-width: 500px) {
      .top-bar {
        top: 10px;
        left: 10px;
        right: 10px;
      }

      .logo {
        font-size: 15px;
        padding: 10px 13px;
      }

      .location-button {
        padding: 10px 12px;
      }

      .ride-card {
        bottom: 10px;
      }
    }
  </style>
</head>

<body>

  <div id="map"></div>

  <div class="top-bar">
    <div class="logo">
      Yango Tracking
      <span class="demo">Educational Demo</span>
    </div>

    <button class="location-button" onclick="startTracking()">
      📍 My Location
    </button>
  </div>

  <div id="gpsMessage" class="gps-message">
    Connecting...
  </div>

  <div class="ride-card">

    <div class="status">
      <span class="dot"></span>
      <span id="status">Driver is on the way</span>
    </div>

    <div class="driver">

      <div class="driver-avatar" id="driverAvatar">
        🚗
      </div>

      <div>
        <div class="driver-name" id="driverName">
          Muhammad Ali
        </div>

        <div class="vehicle" id="vehicle">
          Toyota Corolla • ABC-123
        </div>
      </div>

    </div>

    <div class="route">
      <div>📍 <strong>Pickup:</strong> <span id="pickup">Pickup location</span></div>
      <div>🏁 <strong>Drop-off:</strong> <span id="dropoff">Drop-off location</span></div>
    </div>

    <div class="eta">

      <div>
        <small>Arriving in</small>
        <br>
        <strong id="eta">-- min</strong>
      </div>

      <div>
        <small>Distance</small>
        <br>
        <strong id="distance">-- km</strong>
      </div>

    </div>

    <button class="share" onclick="shareTrip()">
      🔗 Share Trip
    </button>

  </div>


  <!-- Leaflet -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>


  <!-- Firebase -->
  <script type="module">

    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";

    import {
      getDatabase,
      ref,
      onValue
    }
      from "https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js";


    /* =====================================
       YOUR FIREBASE CONFIGURATION
       ===================================== */

    const firebaseConfig = {

      apiKey: "AIzaSyCEaUviM45cSPcs8Te6G0PqsE5imFR2TYE",

      authDomain: "yango-tracking.firebaseapp.com",

      projectId: "yango-tracking",

      storageBucket: "yango-tracking.firebasestorage.app",

      messagingSenderId: "1019473211995",

      appId: "1:1019473211995:web:56a81d2fc43cda8dd5857e",

      databaseURL:
        "https://yango-tracking-default-rtdb.asia-southeast1.firebasedatabase.app"

    };


    /* Start Firebase */

    const app = initializeApp(firebaseConfig);

    const database = getDatabase(app);


    /* =====================================
       TRIP
       ===================================== */

    const tripId = "demo";


    /* =====================================
       MAP
       ===================================== */

    const map = L.map("map").setView(
      [24.8607, 67.0011],
      13
    );

    L.tileLayer(
      "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
      {
        maxZoom: 19,
        attribution: "&copy; OpenStreetMap contributors"
      }
    ).addTo(map);


    let driverMarker = null;
    let userMarker = null;
    let accuracyCircle = null;


    /* =====================================
       DRIVER LIVE LOCATION
       ===================================== */

    const driverLocationRef =
      ref(database, "trips/" + tripId + "/location");


    onValue(driverLocationRef, (snapshot) => {

      const location = snapshot.val();

      if (!location) {
        console.log("Waiting for driver GPS...");
        return;
      }

      const lat = Number(location.lat);
      const lng = Number(location.lng);

      if (!driverMarker) {

        driverMarker = L.marker([lat, lng])
          .addTo(map)
          .bindPopup("🚗 Driver live location");

      } else {

        driverMarker.setLatLng([lat, lng]);

      }

    });


    /* =====================================
       DRIVER / TRIP DETAILS
       ===================================== */

    const tripRef =
      ref(database, "trips/" + tripId);


    onValue(tripRef, (snapshot) => {

      const trip = snapshot.val();

      if (!trip) return;


      if (trip.driver) {

        document.getElementById("driverName").innerText =
          trip.driver.name || "Driver";

        document.getElementById("vehicle").innerText =
          (trip.driver.vehicle || "Vehicle") +
          " • " +
          (trip.driver.plate || "No plate");

        if (trip.driver.photo) {

          document.getElementById("driverAvatar").innerHTML =
            `<img src="${trip.driver.photo}" alt="Driver">`;

        }

      }


      if (trip.status) {

        document.getElementById("status").innerText =
          trip.status;

      }


      if (trip.pickup) {

        document.getElementById("pickup").innerText =
          trip.pickup.name || "Pickup location";

      }


      if (trip.dropoff) {

        document.getElementById("dropoff").innerText =
          trip.dropoff.name || "Drop-off location";

      }

    });


    /* =====================================
       USER'S OWN GPS
       ===================================== */

    window.startTracking = function() {

      const message =
        document.getElementById("gpsMessage");

      message.innerText =
        "Requesting your GPS location...";

      message.style.display = "block";


      if (!navigator.geolocation) {

        message.innerText =
          "GPS is not supported by this browser.";

        return;
      }


      navigator.geolocation.watchPosition(

        function(position) {

          const lat =
            position.coords.latitude;

          const lng =
            position.coords.longitude;

          const accuracy =
            position.coords.accuracy;


          if (!userMarker) {

            userMarker =
              L.marker([lat, lng])
              .addTo(map)
              .bindPopup("📍 Your location");

            accuracyCircle =
              L.circle(
                [lat, lng],
                {
                  radius: accuracy
                }
              )
              .addTo(map);

          } else {

            userMarker.setLatLng([lat, lng]);

            accuracyCircle.setLatLng([lat, lng]);

            accuracyCircle.setRadius(accuracy);

          }


          map.setView(
            [lat, lng],
            16
          );


          message.innerText =
            "📍 Live GPS location active";

          setTimeout(() => {

            message.style.display =
              "none";

          }, 2000);

        },

        function(error) {

          message.style.display =
            "block";

          if (error.code === 1) {

            message.innerText =
              "Location permission was denied.";

          } else {

            message.innerText =
              "Unable to get your location.";

          }

        },

        {
          enableHighAccuracy: true,
          maximumAge: 5000,
          timeout: 10000
        }

      );

    };


    /* =====================================
       SHARE
       ===================================== */

    window.shareTrip = function() {

      const url =
        window.location.href;


      if (navigator.share) {

        navigator.share({

          title: "Yango Tracking",

          text: "Track my ride",

          url: url

        });

      } else {

        navigator.clipboard.writeText(url);

        alert("Tracking link copied!");

      }

    };

  </script>

</body>
</html>
