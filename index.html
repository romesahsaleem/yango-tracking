<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

  <title>Yango Tracking</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
      color: #222;
      background: #eee;
    }

    #map {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    .leaflet-container {
      background: #eee;
      font-family: Arial, Helvetica, sans-serif;
    }

    .leaflet-control-attribution {
      font-size: 9px !important;
      background: rgba(255,255,255,.82) !important;
      padding: 2px 5px !important;
    }

    /* =========================
       LOGO
    ========================= */

    .logo {
      position: fixed;
      top: 28px;
      left: 24px;
      z-index: 1000;
      font-size: 46px;
      font-weight: 900;
      letter-spacing: -3px;
      color: #e21d2f;
      pointer-events: none;
      text-shadow: 0 1px 2px rgba(0,0,0,.08);
    }

    /* =========================
       LOCATION BUTTON
    ========================= */

    .location-button {
      position: fixed;
      right: 18px;
      bottom: calc(55vh + 18px);
      width: 58px;
      height: 58px;
      border: 0;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 4px 18px rgba(0,0,0,.16);
      z-index: 1100;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .location-icon {
      width: 25px;
      height: 25px;
      position: relative;
    }

    .location-icon::before,
    .location-icon::after {
      content: "";
      position: absolute;
      background: #111;
    }

    .location-icon::before {
      width: 3px;
      height: 25px;
      left: 11px;
      top: 0;
    }

    .location-icon::after {
      width: 25px;
      height: 3px;
      left: 0;
      top: 11px;
    }

    .location-icon span {
      position: absolute;
      width: 11px;
      height: 11px;
      background: #111;
      transform: rotate(45deg);
      left: 7px;
      top: 7px;
    }

    /* =========================
       CAR
    ========================= */

    .car-marker {
      width: 54px;
      height: 54px;
      border-radius: 50%;
      background: #ffd21c;
      border: 3px solid white;
      box-shadow:
        0 3px 10px rgba(0,0,0,.25),
        0 0 0 1px rgba(0,0,0,.08);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .car-marker svg {
      width: 31px;
      height: 31px;
    }

    /* =========================
       MAP POINTS
    ========================= */

    .point-marker {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 17px;
      font-weight: 800;
      border: 3px solid #fff;
      box-shadow: 0 3px 10px rgba(0,0,0,.22);
    }

    .pickup-marker {
      background: #e62938;
    }

    .dropoff-marker {
      background: #222;
    }

    /* =========================
       BOTTOM SHEET
    ========================= */

    .bottom-sheet {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      height: 52vh;
      min-height: 390px;
      max-height: 680px;
      background: #fff;
      border-radius: 28px 28px 0 0;
      z-index: 1000;
      box-shadow: 0 -5px 25px rgba(0,0,0,.12);
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
    }

    .handle {
      width: 74px;
      height: 7px;
      border-radius: 10px;
      background: #c8c8c8;
      margin: 18px auto 24px;
    }

    .sheet-header {
      padding: 0 42px 25px;
      border-bottom: 1px solid #eee;
    }

    .status-title {
      font-size: 31px;
      line-height: 1.05;
      font-weight: 800;
      letter-spacing: -1.3px;
      margin-bottom: 22px;
    }

    .vehicle-row {
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
    }

    .vehicle-name {
      font-size: 21px;
      font-weight: 700;
      color: #666;
    }

    .plate {
      padding: 9px 17px;
      border-radius: 13px;
      background: #eee;
      color: #222;
      font-size: 21px;
      font-weight: 800;
      letter-spacing: 1px;
    }

    .eta-row {
      padding: 18px 42px;
      border-bottom: 1px solid #eee;
      font-size: 18px;
      color: #666;
    }

    .eta-row strong {
      color: #222;
    }

    .section-title {
      padding: 28px 42px;
      background: #f7f7f7;
      border-bottom: 1px solid #e7e7e7;
      font-size: 21px;
      font-weight: 800;
      color: #555;
    }

    /* =========================
       LOCATIONS
    ========================= */

    .ride-details {
      padding: 38px 42px 40px;
      background: #fff;
    }

    .location-row {
      display: flex;
      align-items: flex-start;
      min-height: 125px;
    }

    .point-column {
      width: 72px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .detail-point {
      width: 54px;
      height: 54px;
      border-radius: 50%;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 21px;
      font-weight: 800;
      flex-shrink: 0;
    }

    .detail-point.pickup {
      background: #e62938;
    }

    .detail-point.dropoff {
      background: #222;
    }

    .connecting-line {
      width: 4px;
      height: 76px;
      background: #d7d7d7;
    }

    .location-text {
      padding-left: 24px;
      padding-top: 2px;
    }

    .location-label {
      font-size: 17px;
      color: #999;
      letter-spacing: 1px;
      margin-bottom: 8px;
      text-transform: uppercase;
    }

    .location-name {
      font-size: 19px;
      font-weight: 750;
      color: #222;
      line-height: 1.15;
    }

    /* =========================
       DRIVER
    ========================= */

    .driver-card {
      padding: 30px 42px;
      display: flex;
      align-items: center;
      gap: 22px;
      border-bottom: 1px solid #eee;
    }

    .driver-photo {
      width: 82px;
      height: 82px;
      border-radius: 50%;
      object-fit: cover;
      background: #eee;
      flex-shrink: 0;
    }

    .driver-info {
      flex: 1;
    }

    .driver-name {
      font-size: 21px;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .driver-rating {
      font-size: 19px;
      color: #555;
    }

    .driver-rating span {
      color: #f4b400;
    }

    .info-block {
      padding: 28px 42px;
      border-bottom: 1px solid #eee;
    }

    .info-label {
      font-size: 16px;
      color: #999;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }

    .info-value {
      font-size: 18px;
      font-weight: 700;
    }

    /* =========================
       SHARE
    ========================= */

    .share-container {
      padding: 25px 42px 45px;
    }

    .share-button {
      width: 100%;
      border: 0;
      background: #222;
      color: #fff;
      padding: 15px;
      border-radius: 13px;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
    }

    .share-button:active {
      transform: scale(.99);
    }

    /* =========================
       COMPLETED
    ========================= */

    .completed-box {
      display: none;
      margin: 20px 42px 30px;
      padding: 20px;
      border-radius: 15px;
      background: #f1f1f1;
      font-size: 18px;
      font-weight: 700;
      color: #444;
      text-align: center;
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 600px) {
      .logo {
        top: 48px;
        left: 25px;
        font-size: 43px;
      }

      .location-button {
        right: 18px;
        width: 58px;
        height: 58px;
      }

      .status-title {
        font-size: 37px;
      }

      .vehicle-name {
        font-size: 25px;
      }

      .plate {
        font-size: 19px;
      }
    }

    @media (max-width: 400px) {
      .sheet-header,
      .ride-details,
      .driver-card,
      .info-block,
      .share-container {
        padding-left: 28px;
        padding-right: 28px;
      }

      .section-title {
        padding-left: 28px;
        padding-right: 28px;
      }

      .status-title {
        font-size: 32px;
      }

      .vehicle-name {
        font-size: 22px;
      }

      .location-name {
        font-size: 23px;
      }

      .location-text {
        padding-left: 15px;
      }
    }
  </style>
</head>

<body>

  <div id="map"></div>

  <div class="logo">YANGO</div>

  <button
    class="location-button"
    id="locationButton"
    aria-label="Center on driver"
  >
    <div class="location-icon">
      <span></span>
    </div>
  </button>

  <!-- =========================
       BOTTOM SHEET
  ========================== -->

    <div class="handle"></div>

    <div class="sheet-header">

      <div

      </div>

    </div>

    <div class="eta-row">

      </strong>
    </div>

    <div class="section-title">
      Ride details
    </div>

    <div class="ride-details">

      <div class="location-row">

        <div class="point-column">

          <div class="detail-point pickup">
            P
          </div>

          <div class="connecting-line"></div>

        </div>

        <div class="location-text">

          <div class="location-label">
            Pickup
          </div>

          <div
            class="location-name"
            id="pickupName"
          >
            Pickup location
          </div>

        </div>

      </div>

      <div class="location-row">

        <div class="point-column">

          <div class="detail-point dropoff">
            D
          </div>

        </div>

        <div class="location-text">

          <div class="location-label">
            Drop-off
          </div>

          <div
            class="location-name"
            id="dropoffName"
          >
            Drop-off location
          </div>

    </div>

    <div class="section-title">

    </div>

    <div class="driver-card">

        </div>

    </div>

    <div class="info-block">

      </div>

      <div

        Toyota Corolla
      </div>

    </div>

    <div class="info-block">

      <div class="info-label">
        License plate
      </div>

      <div
        class="info-value"

        ABC-123
      </div>

    </div>

    <div class="share-container">

      <button
        class="share-button"
        id="shareButton"
      >
        Share trip
      </button>

    </div>

    <div
      class="completed-box"
      id="completedBox"
    >
      ✓ This trip has been completed.
    </div>

  </div>


  <!-- Leaflet -->

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>


  <!-- Firebase -->

  <script type="module">

    import {
      initializeApp
    } from
      "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";

    import {
      getDatabase,
      ref,
      onValue
    } from
      "https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js";


    /* ==========================================================
       FIREBASE
       PASTE YOUR EXISTING FIREBASE API KEY
    ========================================================== */

    const firebaseConfig = {

      apiKey:
        "AIzaSyCEaUviM45cSPcs8Te6G0PqsE5imFR2TYE",

      authDomain:
        "yango-tracking.firebaseapp.com",

      projectId:
        "yango-tracking",

      storageBucket:
        "yango-tracking.firebasestorage.app",

      messagingSenderId:
        "1019473211995",

      appId:
        "1:1019473211995:web:56a81d2fc43cda8dd5857e",

      databaseURL:
        "https://yango-tracking-default-rtdb.asia-southeast1.firebasedatabase.app"

    };


    const app =
      initializeApp(firebaseConfig);

    const database =
      getDatabase(app);


    /* ==========================================================
       TRIP
    ========================================================== */

    const params =
      new URLSearchParams(
        window.location.search
      );

    const tripId =
      params.get("trip") || "demo";


    /* ==========================================================
       MAP
    ========================================================== */

    const map =
      L.map("map", {
        zoomControl: false,
        attributionControl: true
      }).setView(
        [24.8607, 67.0011],
        13
      );


    /*
      Standard OpenStreetMap tiles.
      No CARTO key required.
    */

    L.tileLayer(
      "https://tile.openstreetmap.org/{z}/{x}/{y}.png",
      {
        attribution:
          '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank">OpenStreetMap contributors</a>',

        maxZoom: 19,

        updateWhenZooming: false,

        updateWhenIdle: true,

        referrerPolicy:
          "strict-origin-when-cross-origin"
      }
    ).addTo(map);


    /* ==========================================================
       VARIABLES
    ========================================================== */

    let carMarker = null;

    let pickupMarker = null;

    let dropoffMarker = null;

    let routeOutline = null;

    let routeInner = null;

    let currentDriverPosition = null;

    let pickupPosition = null;

    let dropoffPosition = null;

    let currentTrip = {};

    let lastRouteRequest = 0;

    let lastRouteKey = "";

    let lastRouteCoordinates = null;

    let lastRouteDuration = null;

    let animationFrame = null;

    let animationStart = null;

    let animationFrom = null;

    let animationTo = null;

    let firstLocation = true;


    /* ==========================================================
       CAR ICON
    ========================================================== */

    const carIcon =
      L.divIcon({

        className: "",

        html: `
          <div class="car-marker">

            <svg
              viewBox="0 0 64 64"
              xmlns="http://www.w3.org/2000/svg"
            >

              <rect
                x="12"
                y="25"
                width="40"
                height="22"
                rx="7"
                fill="#222"
              />

              <path
                d="M19 25 L24 15 H40 L45 25 Z"
                fill="#222"
              />

              <rect
                x="26"
                y="18"
                width="12"
                height="7"
                rx="2"
                fill="#d9e4ea"
              />

              <circle
                cx="21"
                cy="49"
                r="5"
                fill="#222"
              />

              <circle
                cx="43"
                cy="49"
                r="5"
                fill="#222"
              />

              <rect
                x="15"
                y="30"
                width="6"
                height="4"
                rx="2"
                fill="#ffd21c"
              />

              <rect
                x="43"
                y="30"
                width="6"
                height="4"
                rx="2"
                fill="#ffd21c"
              />

            </svg>

          </div>
        `,

        iconSize:
          [54, 54],

        iconAnchor:
          [27, 27]

      });


    /* ==========================================================
       PICKUP ICON
    ========================================================== */

    const pickupIcon =
      L.divIcon({

        className: "",

        html: `
          <div class="point-marker pickup-marker">
            P
          </div>
        `,

        iconSize:
          [38, 38],

        iconAnchor:
          [19, 19]

      });


    /* ==========================================================
       DROPOFF ICON
    ========================================================== */

    const dropoffIcon =
      L.divIcon({

        className: "",

        html: `
          <div class="point-marker dropoff-marker">
            D
          </div>
        `,

        iconSize:
          [38, 38],

        iconAnchor:
          [19, 19]

      });


    /* ==========================================================
       SMOOTH CAR MOVEMENT
       
       IMPORTANT:
       The destination is ALWAYS the newest REAL GPS
       coordinate received from Firebase.
    ========================================================== */

    function animateCarTo(
      lat,
      lng
    ) {

      const newPosition =
        [lat, lng];


      if (!carMarker) {

        carMarker =
          L.marker(
            newPosition,
            {
              icon: carIcon,
              zIndexOffset: 1000
            }
          ).addTo(map);


        currentDriverPosition =
          newPosition;

        return;

      }


      if (animationFrame) {

        cancelAnimationFrame(
          animationFrame
        );

      }


      animationFrom =
        carMarker
          .getLatLng();


      animationTo =
        L.latLng(
          lat,
          lng
        );


      /*
        Calculate animation duration from
        the actual GPS distance.

        Short GPS updates = short animation.
        Larger updates = slightly longer animation.
      */

      const distance =
        map.distance(
          animationFrom,
          animationTo
        );


      const duration =
        Math.min(
          2200,
          Math.max(
            500,
            distance * 18
          )
        );


      animationStart =
        performance.now();


      function animate(
        timestamp
      ) {

        const elapsed =
          timestamp -
          animationStart;


        const progress =
          Math.min(
            elapsed / duration,
            1
          );


        /*
          Smooth ease-in/ease-out.
        */

        const eased =
          progress < 0.5
            ? 2 * progress * progress
            : 1 -
              Math.pow(
                -2 * progress + 2,
                2
              ) / 2;


        const lat =
          animationFrom.lat +
          (
            animationTo.lat -
            animationFrom.lat
          ) *
          eased;


        const lng =
          animationFrom.lng +
          (
            animationTo.lng -
            animationFrom.lng
          ) *
          eased;


        carMarker.setLatLng(
          [lat, lng]
        );


        currentDriverPosition =
          [lat, lng];


        if (progress < 1) {

          animationFrame =
            requestAnimationFrame(
              animate
            );

        } else {

          animationFrame =
            null;

          currentDriverPosition =
            [lat, lng];

          updateMapRoute();

        }

      }


      animationFrame =
        requestAnimationFrame(
          animate
        );

    }


    /* ==========================================================
       PICKUP
    ========================================================== */

    function updatePickup(
      lat,
      lng
    ) {

      pickupPosition =
        [lat, lng];


      if (!pickupMarker) {

        pickupMarker =
          L.marker(
            [lat, lng],
            {
              icon: pickupIcon,
              zIndexOffset: 500
            }
          ).addTo(map);

      } else {

        pickupMarker.setLatLng(
          [lat, lng]
        );

      }

    }


    /* ==========================================================
       DROPOFF
    ========================================================== */

    function updateDropoff(
      lat,
      lng
    ) {

      dropoffPosition =
        [lat, lng];


      if (!dropoffMarker) {

        dropoffMarker =
          L.marker(
            [lat, lng],
            {
              icon: dropoffIcon,
              zIndexOffset: 500
            }
          ).addTo(map);

      } else {

        dropoffMarker.setLatLng(
          [lat, lng]
        );

      }

    }


    /* ==========================================================
       DISTANCE
    ========================================================== */

    function distanceKm(
      a,
      b
    ) {

      const R =
        6371;

      const dLat =
        (
          b[0] -
          a[0]
        ) *
        Math.PI / 180;

      const dLng =
        (
          b[1] -
          a[1]
        ) *
        Math.PI / 180;

      const lat1 =
        a[0] *
        Math.PI / 180;

      const lat2 =
        b[0] *
        Math.PI / 180;


      const x =
        Math.sin(
          dLat / 2
        ) *
        Math.sin(
          dLat / 2
        ) +

        Math.sin(
          dLng / 2
        ) *
        Math.sin(
          dLng / 2
        ) *
        Math.cos(lat1) *
        Math.cos(lat2);


      const c =
        2 *
        Math.atan2(
          Math.sqrt(x),
          Math.sqrt(1 - x)
        );


      return R * c;

    }


    /* ==========================================================
       FALLBACK ETA
    ========================================================== */

    function fallbackEta(
      from,
      to
    ) {

      if (!from || !to) {

        return "Live location";

      }


      const km =
        distanceKm(
          from,
          to
        );


      const minutes =
        Math.max(
          2,
          Math.round(
            (km / 28) * 60
          )
        );


      return `${minutes} min away`;

    }


    /* ==========================================================
       ROUTE DESTINATION
    ========================================================== */

    function getDestination() {

      const status =
        currentTrip.status || "";


      if (
        status === "Trip started"
      ) {

        return dropoffPosition;

      }


      return pickupPosition;

    }


    /* ==========================================================
       DRAW ROUTE
    ========================================================== */

    async function drawRoute(
      from,
      to
    ) {

      if (!from || !to) {

        return;

      }


      const key =
        `${from[0].toFixed(4)},${from[1].toFixed(4)}-${to[0].toFixed(4)},${to[1].toFixed(4)}`;


      const now =
        Date.now();


      /*
        Don't repeatedly request the routing server
        when the car is moving only a tiny amount.
      */

      if (
        key === lastRouteKey
      ) {

        return;

      }


      if (
        now -
        lastRouteRequest <
        5000
      ) {

        return;

      }


      lastRouteRequest =
        now;


      lastRouteKey =
        key;


      try {

        const url =
          `https://router.project-osrm.org/route/v1/driving/` +
          `${from[1]},${from[0]};${to[1]},${to[0]}` +
          `?overview=full&geometries=geojson`;


        const response =
          await fetch(url);


        if (!response.ok) {

          throw new Error(
            "Route request failed"
          );

        }


        const data =
          await response.json();


        if (
          !data.routes ||
          !data.routes.length
        ) {

          throw new Error(
            "No route found"
          );

        }


        const route =
          data.routes[0];


        const coordinates =
          route.geometry.coordinates.map(
            point => [
              point[1],
              point[0]
            ]
          );


        lastRouteCoordinates =
          coordinates;

        lastRouteDuration =
          route.duration;


        if (routeOutline) {

          map.removeLayer(
            routeOutline
          );

        }

        if (routeInner) {

          map.removeLayer(
            routeInner
          );

        }


        /*
          White outline + yellow center
          gives a clean ride-hailing style.
        */

        routeOutline =
          L.polyline(
            coordinates,
            {
              color: "#ffffff",
              weight: 9,
              opacity: .95,
              lineCap: "round",
              lineJoin: "round"
            }
          ).addTo(map);


        routeInner =
          L.polyline(
            coordinates,
            {
              color: "#f3c400",
              weight: 5,
              opacity: 1,
              lineCap: "round",
              lineJoin: "round"
            }
          ).addTo(map);


        const minutes =
          Math.max(
            1,
            Math.round(
              route.duration / 60
            )
          );


        document.getElementById(
          "etaText"
        ).textContent =
          `${minutes} min away`;

      }

      catch (error) {

        console.log(
          "Route unavailable:",
          error
        );


        /*
          Keep the previous real route/ETA
          instead of flickering.
        */

        if (
          lastRouteDuration != null
        ) {

          const minutes =
            Math.max(
              1,
              Math.round(
                lastRouteDuration /
                60
              )
            );


          document.getElementById(
            "etaText"
          ).textContent =
            `${minutes} min away`;

        } else {

          document.getElementById(
            "etaText"
          ).textContent =
            fallbackEta(
              from,
              to
            );

        }

      }

    }


    /* ==========================================================
       UPDATE ROUTE
    ========================================================== */

    function updateMapRoute() {

      if (!currentDriverPosition) {

        return;

      }


      const destination =
        getDestination();


      if (destination) {

        drawRoute(
          currentDriverPosition,
          destination
        );

      }

    }


    /* ==========================================================
       STATUS
    ========================================================== */

    function updateStatus() {

      const status =
        currentTrip.status ||
        "Driver on the way";


      document.getElementById(
        "statusTitle"
      ).textContent =
        status;


      const completedBox =
        document.getElementById(
          "completedBox"
        );


      if (
        status === "Trip completed"
      ) {

        completedBox.style.display =
          "block";


        document.getElementById(
          "etaText"
        ).textContent =
          "Trip completed";

      } else {

        completedBox.style.display =
          "none";

      }

    }


    /* ==========================================================
       DRIVER PHOTO FALLBACK
    ========================================================== */

    function setDriverPhoto(
      photoUrl
    ) {

      const photo =
        document.getElementById(
          "driverPhoto"
        );


      if (photoUrl) {

        photo.src =
          photoUrl;

        return;

      }


      photo.src =
        "data:image/svg+xml;charset=UTF-8," +
        encodeURIComponent(`
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="100"
            height="100"
            viewBox="0 0 100 100"
          >

            <circle
              cx="50"
              cy="50"
              r="50"
              fill="#eeeeee"
            />

            <circle
              cx="50"
              cy="38"
              r="17"
              fill="#bbbbbb"
            />

            <path
              d="M22 84
                 C22 65 34 57 50 57
                 C66 57 78 65 78 84"
              fill="#bbbbbb"
            />

          </svg>
        `);

    }


    /* ==========================================================
       UPDATE INFORMATION
    ========================================================== */

    function updateInformation(
      trip
    ) {

      currentTrip =
        trip || {};


      document.getElementById(
        "vehicleName"
      ).textContent =
        trip.vehicle ||
        "Vehicle";


      document.getElementById(
        "vehicleInfo"
      ).textContent =
        trip.vehicle ||
        "Vehicle";


      document.getElementById(
        "plate"
      ).textContent =
        trip.plate ||
        "—";


      document.getElementById(
        "plateInfo"
      ).textContent =
        trip.plate ||
        "—";


      document.getElementById(
        "pickupName"
      ).textContent =
        trip.pickup ||
        "Pickup location";


      document.getElementById(
        "dropoffName"
      ).textContent =
        trip.dropoff ||
        "Drop-off location";


      document.getElementById(
        "driverName"
      ).textContent =
        trip.driverName ||
        "Driver";


      document.getElementById(
        "driverRating"
      ).textContent =
        trip.rating ||
        "4.9";


      setDriverPhoto(
        trip.driverPhoto
      );


      updateStatus();


      /*
        Status can change the route destination
        from pickup to drop-off.
      */

      lastRouteKey =
        "";

      updateMapRoute();

    }


    /* ==========================================================
       FIREBASE
    ========================================================== */

    const tripRef =
      ref(
        database,
        `trips/${tripId}`
      );


    onValue(
      tripRef,

      snapshot => {

        const trip =
          snapshot.val();


        if (!trip) {

          document.getElementById(
            "statusTitle"
          ).textContent =
            "Trip not found";


          document.getElementById(
            "etaText"
          ).textContent =
            "Waiting for trip information";


          return;

        }


        updateInformation(
          trip
        );


        /* =====================
           PICKUP
        ===================== */

        if (
          trip.pickupLat != null &&
          trip.pickupLng != null
        ) {

          updatePickup(
            Number(
              trip.pickupLat
            ),
            Number(
              trip.pickupLng
            )
          );

        }


        /* =====================
           DROPOFF
        ===================== */

        if (
          trip.dropoffLat != null &&
          trip.dropoffLng != null
        ) {

          updateDropoff(
            Number(
              trip.dropoffLat
            ),
            Number(
              trip.dropoffLng
            )
          );

        }


        /* =====================
           REAL DRIVER GPS
        ===================== */

        if (
          trip.location &&
          trip.location.lat != null &&
          trip.location.lng != null
        ) {

          const lat =
            Number(
              trip.location.lat
            );

          const lng =
            Number(
              trip.location.lng
            );


          /*
            First real GPS location:
            show immediately and center map.
          */

          if (
            firstLocation
          ) {

            firstLocation =
              false;


            if (!carMarker) {

              carMarker =
                L.marker(
                  [lat, lng],
                  {
                    icon: carIcon,
                    zIndexOffset: 1000
                  }
                ).addTo(map);

            } else {

              carMarker.setLatLng(
                [lat, lng]
              );

            }


            currentDriverPosition =
              [lat, lng];


            map.setView(
              [lat, lng],
              15,
              {
                animate: true
              }
            );


            updateMapRoute();

          } else {

            /*
              Every subsequent position is
              animated smoothly.
            */

            animateCarTo(
              lat,
              lng
            );

          }

        }

      },

      error => {

        console.error(
          "Firebase error:",
          error
        );


        document.getElementById(
          "statusTitle"
        ).textContent =
          "Unable to load trip";


        document.getElementById(
          "etaText"
        ).textContent =
          "Check your connection";

      }

    );


    /* ==========================================================
       LOCATION BUTTON
    ========================================================== */

    document.getElementById(
      "locationButton"
    ).addEventListener(
      "click",
      () => {

        if (
          currentDriverPosition
        ) {

          map.flyTo(
            currentDriverPosition,
            16,
            {
              duration: .7
            }
          );

        }

      }
    );


    /* ==========================================================
       SHARE
    ========================================================== */

    document.getElementById(
      "shareButton"
    ).addEventListener(
      "click",
      async () => {

        const shareUrl =
          window.location.href;


        try {

          if (
            navigator.share
          ) {

            await navigator.share({

              title:
                "Live trip tracking",

              text:
                "Track this trip live.",

              url:
                shareUrl

            });

          } else {

            await navigator.clipboard.writeText(
              shareUrl
            );


            alert(
              "Tracking link copied."
            );

          }

        }

        catch (error) {

          console.log(
            "Share cancelled."
          );

        }

      }
    );


    /* ==========================================================
       MAP RESIZE
    ========================================================== */

    setTimeout(
      () => {

        map.invalidateSize();

      },
      500
    );


    window.addEventListener(
      "resize",
      () => {

        map.invalidateSize();

      }
    );

  </script>

</body>
</html>
