<html lang="en">

<title>Yango Tracking</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Arial,Helvetica,sans-serif;
  background:#fff;
  color:#222;
}

#map{
  position:fixed;
  inset:0;
  z-index:1;
}

.leaflet-control-attribution{
  font-size:9px;
}

/* =========================
   YANGO WORDMARK
========================= */

.brand{
  position:fixed;
  top:28px;
  left:32px;
  z-index:900;

  font-weight:900;
  font-size:42px;
  letter-spacing:-2.8px;
  line-height:1;

  color:#e21b23;

  text-shadow:
    0 1px 0 rgba(255,255,255,.55);
}

/* =========================
   LOCATION BUTTON
========================= */

.locate-btn{
  position:fixed;

  right:20px;
  bottom:calc(55vh + 18px);

  z-index:950;

  width:54px;
  height:54px;

  border:0;
  border-radius:50%;

  background:#fff;

  box-shadow:
    0 4px 18px rgba(0,0,0,.22);

  display:flex;
  align-items:center;
  justify-content:center;

  cursor:pointer;
}

.locate-btn svg{
  width:25px;
  height:25px;
  fill:#222;
}

/* =========================
   CAR MARKER
========================= */

.car-marker{
  width:54px;
  height:54px;

  border-radius:50%;

  background:#f8d51b;

  border:4px solid #fff;

  box-shadow:
    0 3px 10px rgba(0,0,0,.3);

  display:flex;
  align-items:center;
  justify-content:center;
}

.car-marker svg{
  width:36px;
  height:36px;
}

/* =========================
   MAP POINT MARKERS
========================= */

.point-marker{
  width:38px;
  height:38px;

  border-radius:50%;

  display:flex;
  align-items:center;
  justify-content:center;

  color:#fff;

  font-weight:900;
  font-size:17px;

  border:3px solid #fff;

  box-shadow:
    0 3px 9px rgba(0,0,0,.28);
}

.pickup-marker{
  background:#e62b32;
}

.dropoff-marker{
  background:#202020;
}

/* =========================
   BOTTOM SHEET
========================= */

.sheet{
  position:fixed;

  left:0;
  right:0;
  bottom:0;

  z-index:800;

  background:#fff;

  border-radius:28px 28px 0 0;

  box-shadow:
    0 -6px 25px rgba(0,0,0,.18);

  height:55vh;
  min-height:420px;
  max-height:720px;

  overflow-y:auto;
  overflow-x:hidden;

  -webkit-overflow-scrolling:touch;
}

.sheet::-webkit-scrollbar{
  width:6px;
}

.sheet::-webkit-scrollbar-thumb{
  background:#c7c7c7;
  border-radius:10px;
}

/* Drag handle */

.handle{
  width:42px;
  height:5px;

  background:#c8c8c8;

  border-radius:99px;

  margin:12px auto 5px;
}

/* =========================
   TOP RIDE INFO
========================= */

.sheet-top{
  padding:8px 22px 20px;
}

.status{
  font-size:25px;
  line-height:1.15;

  font-weight:800;

  color:#202020;

  margin:
    5px 0 10px;
}

.vehicle-top{
  display:flex;
  align-items:center;
  gap:8px;

  font-size:16px;
  font-weight:600;

  color:#666;
}

.plate{
  background:#f0f0f0;

  color:#222;

  border-radius:7px;

  padding:5px 9px;

  font-size:13px;

  font-weight:800;

  letter-spacing:.6px;
}

/* =========================
   SECTION HEADINGS
========================= */

.section-title{
  background:#f5f5f5;

  border-top:1px solid #ededed;
  border-bottom:1px solid #ededed;

  padding:17px 22px;

  font-size:20px;

  font-weight:800;

  color:#555;
}

/* =========================
   RIDE DETAILS
========================= */

.details{
  padding:22px;
}

.detail-row{
  display:flex;

  gap:16px;

  min-height:82px;

  position:relative;
}

.detail-row:not(:last-child)::after{
  content:"";

  position:absolute;

  left:19px;
  top:43px;

  width:2px;
  height:47px;

  background:#cfcfcf;
}

.detail-icon{
  flex:0 0 40px;

  width:40px;
  height:40px;

  border-radius:50%;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:17px;
  font-weight:900;

  color:#fff;

  z-index:2;
}

.detail-icon.p{
  background:#e63238;
}

.detail-icon.d{
  background:#222;
}

.detail-label{
  text-transform:uppercase;

  color:#a0a0a0;

  font-size:13px;

  letter-spacing:.4px;

  margin:
    1px 0 5px;
}

.detail-value{
  font-size:17px;

  line-height:1.25;

  font-weight:600;

  color:#242424;

  word-break:break-word;
}

/* =========================
   DRIVER
========================= */

.driver{
  padding:22px;

  display:flex;
  align-items:center;

  gap:17px;
}

.driver-photo{
  width:78px;
  height:78px;

  border-radius:50%;

  object-fit:cover;

  background:#eee;

  flex:none;
}

.driver-placeholder{
  width:78px;
  height:78px;

  border-radius:50%;

  background:#efefef;

  display:flex;
  align-items:center;
  justify-content:center;

  flex:none;
}

.driver-placeholder svg{
  width:46px;
  height:46px;

  fill:#1684d8;
}

.driver-name{
  font-size:22px;

  font-weight:800;

  margin-bottom:8px;
}

.rating{
  font-size:16px;

  color:#333;
}

.star{
  color:#f0c400;

  font-size:22px;

  vertical-align:-2px;

  margin-right:5px;
}

/* =========================
   VEHICLE DETAILS
========================= */

.info-grid{
  padding:0 22px 22px;

  display:grid;

  grid-template-columns:1fr;

  gap:0;
}

.info-item{
  padding:16px 0;

  border-bottom:1px solid #eee;
}

.info-label{
  font-size:14px;

  color:#9a9a9a;

  margin-bottom:6px;
}

.info-value{
  font-size:18px;

  font-weight:700;

  color:#222;
}

/* =========================
   SHARE
========================= */

.share-wrap{
  padding:20px 22px 28px;
}

.share-btn{
  width:100%;

  height:52px;

  border:0;

  border-radius:15px;

  background:#e52c32;

  color:#fff;

  font-size:17px;

  font-weight:800;

  cursor:pointer;
}

/* =========================
   COMPLETED
========================= */

.complete{
  padding:26px 22px 40px;

  text-align:center;
}

.complete-icon{
  width:64px;
  height:64px;

  border-radius:50%;

  background:#f0f0f0;

  display:flex;
  align-items:center;
  justify-content:center;

  margin:
    0 auto 12px;

  font-size:30px;
}

.complete h2{
  margin:0 0 6px;

  font-size:24px;
}

.complete p{
  margin:0;

  color:#777;

  font-size:15px;
}

/* =========================
   LOADING
========================= */

.loading{
  position:fixed;

  inset:0;

  z-index:2000;

  background:#fff;

  display:flex;

  align-items:center;
  justify-content:center;

  flex-direction:column;

  gap:12px;
}

.spinner{
  width:36px;
  height:36px;

  border:4px solid #eee;

  border-top-color:#e52c32;

  border-radius:50%;

  animation:spin .8s linear infinite;
}

@keyframes spin{
  to{
    transform:rotate(360deg);
  }
}

/* =========================
   ERROR
========================= */

.error-box{
  position:fixed;

  left:18px;
  right:18px;
  top:75px;

  z-index:1900;

  background:#fff;

  border-radius:16px;

  padding:18px;

  box-shadow:
    0 5px 25px rgba(0,0,0,.22);

  display:none;
}

.error-box strong{
  display:block;

  font-size:18px;

  margin-bottom:8px;
}

.error-box p{
  margin:0;

  color:#666;

  line-height:1.4;
}

/* =========================
   MOBILE
========================= */

@media (max-width:600px){

  .brand{
    top:27px;
    left:31px;

    font-size:40px;
  }

  .sheet{
    height:55vh;
    min-height:420px;

    border-radius:
      27px 27px 0 0;
  }

  .status{
    font-size:23px;
  }

  .locate-btn{
    bottom:calc(55vh + 18px);

    right:18px;
  }
}

/* =========================
   DESKTOP
========================= */

@media (min-width:601px){

  .sheet{
    left:50%;
    right:auto;

    transform:translateX(-50%);

    width:430px;

    border-radius:
      28px 28px 0 0;
  }

  .brand{
    left:calc(50% - 185px);
  }

  .locate-btn{
    right:calc(50% - 185px);
  }
}
</style>

L.tileLayer(

/* =====================================================

===================================================== */

let carMarker = null;

let pickupMarker = null;

let dropoffMarker = null;

let routeLine = null;

let lastRouteKey = "";

let lastRouteTime = 0;

let firstLocation = true;


/* =====================================================

===================================================== */

const loading =

const errorBox =

/* =====================================================

/* =====================================================
   SET TEXT
===================================================== */

function setText(
  id,
  value,
  fallback="--"
){

  const element =
    document.getElementById(id);

  if(
    value !== undefined &&
    value !== null &&
    String(value).trim() !== ""
  ){

    element.textContent =
      value;

  }else{

    element.textContent =
      fallback;

  }

}


/* =====================================================
   VEHICLE
===================================================== */

function getVehicle(trip){

  if(trip.vehicle)
    return trip.vehicle;

  if(
    trip.vehicleColor ||
    trip.vehicleModel
  ){

    return [
      trip.vehicleColor,
      trip.vehicleModel
    ]
    .filter(Boolean)
    .join(" ");

  }

  return "Vehicle";
}


/* =====================================================
   DISTANCE
===================================================== */

function haversine(
  a,
  b
){

  const R =
    6371e3;

  const p1 =
    a.lat *
    Math.PI /
    180;

  const p2 =
    b.lat *
    Math.PI /
    180;

  const dp =
    (b.lat-a.lat) *
    Math.PI /
    180;

  const dl =
    (b.lng-a.lng) *
    Math.PI /
    180;

  const x =
    Math.sin(dp/2)**2 +
    Math.cos(p1) *
    Math.cos(p2) *
    Math.sin(dl/2)**2;

  return R *
    2 *
    Math.atan2(
      Math.sqrt(x),
      Math.sqrt(1-x)
    );

}


/* =====================================================
   ETA
===================================================== */

function formatMinutes(
  seconds
){

  if(
    !Number.isFinite(seconds)
  ){

    return "--";

  }

  const mins =
    Math.max(
      1,
      Math.round(seconds/60)
    );

  return mins;

}


/* =====================================================
   STATUS
===================================================== */

function statusText(
  status,
  eta
){

  if(
    status ===
    "Driver arrived"
  ){

    return "Driver has arrived";

  }


  if(
    status ===
    "Trip started"
  ){

    if(eta !== null)
      return `Trip in progress, ${formatMinutes(eta)} min left`;

    return "Trip in progress";

  }


  if(
    status ===
    "Trip completed"
  ){

    return "Trip completed";

  }


  if(
    status ===
    "Driver is on the way"
  ){

    if(eta !== null)
      return `Driver on the way, ${formatMinutes(eta)} min left`;

    return "Driver on the way";

  }


  return "Driver on the way";

}


/* =====================================================
   ROUTE DESTINATION
===================================================== */

function getDestinationForRoute(
  trip,
  loc
){

  const status =
    trip.status ||
    "Driver is on the way";


  if(
    status === "Trip started" &&
    trip.dropoffLocation?.lat &&
    trip.dropoffLocation?.lng
  ){

    return {

      lat:
        Number(
          trip.dropoffLocation.lat
        ),

      lng:
        Number(
          trip.dropoffLocation.lng
        )

    };

  }


  if(
    (
      status ===
      "Driver is on the way" ||

      status ===
      "Driver arrived"
    ) &&

    trip.pickupLocation?.lat &&

    trip.pickupLocation?.lng
  ){

    return {

      lat:
        Number(
          trip.pickupLocation.lat
        ),

      lng:
        Number(
          trip.pickupLocation.lng
        )

    };

  }


  return null;

}


/* =====================================================
   DRAW ROAD ROUTE
===================================================== */

async function drawRoute(
  trip,
  loc
){

  const destination =
    getDestinationForRoute(
      trip,
      loc
    );


  if(!destination)
    return null;


  const key =

    `${loc.lat.toFixed(4)},` +
    `${loc.lng.toFixed(4)}|` +

    `${destination.lat.toFixed(5)},` +
    `${destination.lng.toFixed(5)}|` +

    `${trip.status}`;


  const now =
    Date.now();


  if(
    key === lastRouteKey &&
    now-lastRouteTime < 15000
  ){

    return null;

  }


  lastRouteKey =
    key;


  lastRouteTime =
    now;


  try{

    const url =

      `https://router.project-osrm.org/route/v1/driving/` +

      `${loc.lng},${loc.lat};` +

      `${destination.lng},${destination.lat}` +

      `?overview=full&geometries=geojson`;


    const response =
      await fetch(url);


    const json =
      await response.json();


    if(
      !json.routes ||
      !json.routes.length
    ){

      return null;

    }


    const route =
      json.routes[0];


    const coords =

      route.geometry.coordinates
      .map(
        c => [c[1],c[0]]
      );


    if(routeLine){

      map.removeLayer(
        routeLine
      );

    }


    routeLine =

      L.polyline(
        coords,
        {
          color:"#e5c800",
          weight:6,
          opacity:.95,
          lineCap:"round",
          lineJoin:"round"
        }
      )
      .addTo(map);


    return route;

  }catch(error){

    console.warn(
      "Route error:",
      error
    );

    return null;

  }

}


/* =====================================================
   UPDATE MAP MARKERS
===================================================== */

function updateMarkers(
  trip,
  loc
){

  if(
    !loc ||
    !Number.isFinite(
      Number(loc.lat)
    ) ||
    !Number.isFinite(
      Number(loc.lng)
    )
  ){

    return;

  }


  const position = [

    Number(loc.lat),

    Number(loc.lng)

  ];


  /* CAR */

  if(!carMarker){

    carMarker =

      L.marker(
        position,
        {
          icon:carIcon,
          zIndexOffset:1000
        }
      )
      .addTo(map);

  }else{

    carMarker.setLatLng(
      position
    );

  }


  /* PICKUP */

  if(
    trip.pickupLocation?.lat &&
    trip.pickupLocation?.lng
  ){

    const pickup = [

      Number(
        trip.pickupLocation.lat
      ),

      Number(
        trip.pickupLocation.lng
      )

    ];


    if(!pickupMarker){

      pickupMarker =

        L.marker(
          pickup,
          {
            icon:
              pointIcon(
                "+",
                "pickup-marker"
              ),

            zIndexOffset:500
          }
        )
        .addTo(map);

    }else{

      pickupMarker.setLatLng(
        pickup
      );

    }

  }


  /* DROP OFF */

  if(
    trip.dropoffLocation?.lat &&
    trip.dropoffLocation?.lng
  ){

    const dropoff = [

      Number(
        trip.dropoffLocation.lat
      ),

      Number(
        trip.dropoffLocation.lng
      )

    ];


    if(!dropoffMarker){

      dropoffMarker =

        L.marker(
          dropoff,
          {
            icon:
              pointIcon(
                "+",
                "dropoff-marker"
              ),

            zIndexOffset:500
          }
        )
        .addTo(map);

    }else{

      dropoffMarker.setLatLng(
        dropoff
      );

    }

  }


  /* FIRST GPS LOCATION */

  if(firstLocation){

    map.setView(
      position,
      15
    );

    firstLocation =
      false;

  }

}


/* =====================================================
   UPDATE BOTTOM SHEET
===================================================== */

function updateSheet(
  trip,
  loc,
  route
){

  const vehicle =
    getVehicle(trip);


  /* VEHICLE */

  setText(
    "topVehicle",
    vehicle,
    "Vehicle"
  );


  setText(
    "topPlate",
    trip.plate,
    "---"
  );


  setText(
    "vehicleText",
    vehicle,
    "--"
  );


  setText(
    "plateText",
    trip.plate,
    "--"
  );


  /* LOCATIONS */

  setText(
    "pickupText",
    trip.pickup,
    "--"
  );


  setText(
    "dropoffText",
    trip.dropoff,
    "--"
  );


  /* DRIVER */

  setText(
    "driverName",
    trip.driverName,
    "Driver"
  );


  setText(
    "ratingText",
    trip.rating,
    "--"
  );


  /* DRIVER PHOTO */

  const photo =
    String(
      trip.driverPhoto || ""
    ).trim();


  const wrap =
    document.getElementById(
      "driverPhotoWrap"
    );


  if(photo){

    wrap.className = "";

    wrap.innerHTML =

      `<img
        class="driver-photo"
        src="${photo.replace(
          /"/g,
          "&quot;"
        )}"
        alt="Driver"
        onerror="
          this.parentElement.className='driver-placeholder';
          this.parentElement.innerHTML=
          '<svg viewBox=&quot;0 0 24 24&quot;><path d=&quot;M12 12a4.2 4.2 0 1 0 0-8.4A4.2 4.2 0 0 0 12 12zm0 2c-4.1 0-7.4 2.2-7.4 5v1h14.8v-1c0-2.8-3.3-5-7.4-5z&quot;/></svg>'
        "
      >`;

  }else{

    wrap.className =
      "driver-placeholder";


    wrap.innerHTML =

      `<svg viewBox="0 0 24 24">

        <path d="
          M12 12
          a4.2 4.2 0 1 0
          0-8.4
          A4.2 4.2 0 0 0
          12 12z

          M12 14
          c-4.1 0-7.4 2.2-7.4 5v1
          h14.8v-1
          c0-2.8-3.3-5-7.4-5z
        "/>

      </svg>`;

  }


  /* ETA */

  let eta =
    null;


  if(
    route?.duration
  ){

    eta =
      route.duration;

  }else if(

    trip.status !==
    "Trip completed" &&

    loc &&

    trip.dropoffLocation?.lat &&
    trip.dropoffLocation?.lng

  ){

    const destination =
      getDestinationForRoute(
        trip,
        loc
      );


    if(destination){

      eta =
        haversine(
          loc,
          destination
        ) / 8.33;

    }

  }


  /* STATUS */

  document.getElementById(
    "statusText"
  )
  .textContent =

    statusText(
      trip.status,
      eta
    );


  /* COMPLETED */

  const completed =
    trip.status ===
    "Trip completed";


  document.getElementById(
    "completeState"
  )
  .style.display =

    completed
      ? "block"
      : "none";


  document.querySelector(
    ".share-wrap"
  )
  .style.display =

    completed
      ? "none"
      : "block";

}


/* =====================================================
   ERROR
===================================================== */

function showError(
  message
){

  errorText.textContent =
    message;

  errorBox.style.display =
    "block";

  loading.style.display =
    "none";

}


/* =====================================================
   LOCATION BUTTON
===================================================== */

document
  .getElementById(
    "locateBtn"
  )
  .addEventListener(
    "click",
    () => {

      if(carMarker){

        map.setView(
          carMarker.getLatLng(),
          16,
          {
            animate:true
          }
        );

      }

    }
  );


/* =====================================================
   SHARE BUTTON
===================================================== */

document
  .getElementById(
    "shareBtn"
  )
  .addEventListener(
    "click",
    async () => {

      const shareData = {

        title:
          "Trip tracking",

        text:
          `Track trip ${tripId}`,

        url:
          location.href

      };


      try{

        if(
          navigator.share
        ){

          await navigator.share(
            shareData
          );

        }else{

          await navigator.clipboard
            .writeText(
              location.href
            );

          alert(
            "Tracking link copied."
          );

        }

      }catch(error){

        if(
          error.name !==
          "AbortError"
        ){

          alert(
            "Could not share the tracking link."
          );

        }

      }

    }
  );


/* =====================================================
   FIREBASE REAL-TIME LISTENER
===================================================== */

onValue(

  ref(
    database,
    `trips/${tripId}`
  ),

  async (snapshot) => {

    const trip =
      snapshot.val();


    if(!trip){

      showError(
        `Trip "${tripId}" was not found. Open the Admin page and save this trip first.`
      );

      return;

    }


    loading.style.display =
      "none";

    errorBox.style.display =
      "none";


    const loc =
      trip.location;


    /* MAP */

    updateMarkers(
      trip,
      loc
    );


    /* ROUTE */

    const route =
      loc
        ? await drawRoute(
            trip,
            loc
          )
        : null;


    /* UI */

    updateSheet(
      trip,
      loc,
      route
    );

  }

);


/* =====================================================
   LOADING TIMEOUT
===================================================== */

setTimeout(
  () => {

    if(
      loading.style.display !==
      "none"
    ){

      showError(
        "The trip is taking too long to load. Check your Firebase connection and trip ID."
      );

    }

  },
  10000
);

</script>

</body>
</html>
