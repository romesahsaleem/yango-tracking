<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Yango Tracking</title>


  <!-- Leaflet -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >


  <style>

    * {
      box-sizing: border-box;
    }


    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }


    #map {
      width: 100%;
      height: 100%;
    }


    /* ========================= */
    /* TOP LOGO */
    /* ========================= */

    .logo {
      position: fixed;
      top: 18px;
      left: 18px;
      z-index: 1000;

      background: white;
      padding: 9px 14px;

      border-radius: 10px;

      box-shadow:
        0 3px 15px rgba(0,0,0,0.18);

      font-size: 22px;
      font-weight: 900;

      color: #e00000;

      letter-spacing: 1px;
    }


    /* ========================= */
    /* MY LOCATION */
    /* ========================= */

    .location-btn {
      position: fixed;

      top: 75px;
      right: 18px;

      z-index: 1000;

      width: 46px;
      height: 46px;

      border: none;
      border-radius: 50%;

      background: white;

      box-shadow:
        0 3px 15px rgba(0,0,0,0.18);

      font-size: 21px;

      cursor: pointer;
    }


    /* ========================= */
    /* DRIVER CARD */
    /* ========================= */

    .ride-card {

      position: fixed;

      left: 50%;
      bottom: 18px;

      transform: translateX(-50%);

      z-index: 1000;

      width: min(500px, calc(100% - 24px));

      background: white;

      border-radius: 20px;

      padding: 18px;

      box-shadow:
        0 5px 25px rgba(0,0,0,0.22);

      max-height: 58vh;

      overflow-y: auto;
    }


    /* ========================= */
    /* STATUS */
    /* ========================= */

    .status {

      display: flex;
      align-items: center;

      gap: 8px;

      font-weight: bold;

      margin-bottom: 14px;
    }


    .status-dot {

      width: 10px;
      height: 10px;

      border-radius: 50%;

      background: #16a34a;
    }


    .status.completed {
      color: #111;
    }


    .status.completed .status-dot {
      background: #111;
    }


    .status.stopped {
      color: #a00000;
    }


    .status.stopped .status-dot {
      background: #a00000;
    }


    /* ========================= */
    /* DRIVER */
    /* ========================= */

    .driver-row {

      display: flex;
      align-items: center;

      gap: 13px;

      margin-bottom: 15px;
    }


    .driver-photo {

      width: 58px;
      height: 58px;

      border-radius: 50%;

      object-fit: cover;

      background: #eee;

      border: 2px solid #eee;
    }


    .driver-placeholder {

      width: 58px;
      height: 58px;

      border-radius: 50%;

      background: #eee;

      display: flex;

      align-items: center;
      justify-content: center;

      font-size: 25px;
    }


    .driver-name {

      font-size: 18px;
      font-weight: bold;
    }


    .rating {

      font-size: 14px;

      margin-top: 4px;

      color: #555;
    }


    /* ========================= */
    /* VEHICLE */
    /* ========================= */

    .vehicle {

      background: #f7f7f7;

      border-radius: 12px;

      padding: 11px;

      margin-bottom: 12px;

      font-size: 14px;
    }


    /* ========================= */
    /* LOCATIONS */
    /* ========================= */

    .location-row {

      display: flex;

      gap: 10px;

      margin-top: 10px;

      font-size: 14px;
    }


    .location-icon {

      width: 25px;
      height: 25px;

      border-radius: 50%;

      display: flex;

      align-items: center;
      justify-content: center;

      color: white;

      font-size: 12px;

      flex-shrink: 0;
    }


    .pickup-icon {
      background: #111;
    }


    .dropoff-icon {
      background: #e00000;
    }


    .location-text {
      font-weight: 600;
    }


    /* ========================= */
    /* STATS */
    /* ========================= */

    .stats {

      display: flex;

      gap: 10px;

      margin-top: 15px;
    }


    .stat {

      flex: 1;

      background: #f7f7f7;

      border-radius: 12px;

      padding: 12px;

      text-align: center;
    }


    .stat-title {

      font-size: 11px;

      color: #777;

      text-transform: uppercase;

      margin-bottom: 5px;
    }


    .stat-value {

      font-size: 17px;

      font-weight: bold;
    }


    /* ========================= */
    /* COMPLETED MESSAGE */
    /* ========================= */

    .completed-box {

      display: none;

      margin-top: 14px;

      padding: 16px;

      border-radius: 14px;

      background: #f3f3f3;

      text-align: center;
    }


    .completed-icon {

      font-size: 32px;

      margin-bottom: 6px;
    }


    .completed-title {

      font-size: 20px;

      font-weight: bold;
    }


    .completed-text {

      color: #666;

      margin-top: 5px;

      font-size: 14px;
    }


    /* ========================= */
    /* SHARE BUTTON */
    /* ========================= */

    .share-btn {

      width: 100%;

      margin-top: 15px;

      padding: 14px;

      border: none;

      border-radius: 12px;

      background: #111;

      color: white;

      font-size: 15px;

      font-weight: bold;

      cursor: pointer;
    }


    /* ========================= */
    /* CAR MARKER */
    /* ========================= */

    .car-marker {

      width: 48px;
      height: 48px;

      border-radius: 50%;

      background: #e00000;

      border: 4px solid white;

      box-shadow:
        0 3px 12px rgba(0,0,0,0.35);

      display: flex;

      align-items: center;
      justify-content: center;

      font-size: 24px;
    }


    /* ========================= */
    /* PICKUP/DROPOFF MARKERS */
    /* ========================= */

    .map-pin {

      width: 34px;
      height: 34px;

      border-radius: 50%;

      display: flex;

      align-items: center;
      justify-content: center;

      color: white;

      font-weight: bold;

      border: 3px solid white;

      box-shadow:
        0 2px 9px rgba(0,0,0,0.35);
    }


    .map-pickup {
      background: #111;
    }


    .map-dropoff {
      background: #e00000;
    }


    /* ========================= */
    /* MOBILE */
    /* ========================= */

    @media (max-width: 600px) {

      .ride-card {
        bottom: 10px;

        padding: 15px;

        border-radius: 18px;

        max-height: 60vh;
      }

      .logo {
        top: 12px;
        left: 12px;
      }

      .location-btn {
        top: 65px;
        right: 12px;
      }

    }

  </style>

</head>


<body>


  <!-- MAP -->

  <div id="map"></div>


  <!-- LOGO -->

  <div class="logo">
    YANGO
  </div>


  <!-- MY LOCATION -->

  <button
    class="location-btn"
    onclick="goToDriver()"
    title="Driver location"
  >
    🚗
  </button>



  <!-- ========================= -->
  <!-- RIDE CARD -->
  <!-- ========================= -->

  <div class="ride-card">


    <!-- STATUS -->

    <div
      id="status"
      class="status"
    >

      <span class="status-dot"></span>

      <span id="statusText">
        Loading trip...
      </span>

    </div>



    <!-- DRIVER -->

    <div class="driver-row">


      <div id="driverPhotoContainer">

        <div class="driver-placeholder">
          👤
        </div>

      </div>


      <div>

        <div
          id="driverName"
          class="driver-name"
        >
          Driver
        </div>


        <div
          id="rating"
          class="rating"
        >
          ⭐ --
        </div>

      </div>

    </div>



    <!-- VEHICLE -->

    <div
      id="vehicle"
      class="vehicle"
    >
      🚗 Vehicle information
    </div>



    <!-- PICKUP -->

    <div class="location-row">

      <div
        class="location-icon pickup-icon"
      >
        P
      </div>

      <div>

        <div
          style="font-size:11px;color:#777;"
        >
          PICKUP
        </div>

        <div
          id="pickup"
          class="location-text"
        >
          --
        </div>

      </div>

    </div>



    <!-- DROP-OFF -->

    <div class="location-row">

      <div
        class="location-icon dropoff-icon"
      >
        D
      </div>

      <div>

        <div
          style="font-size:11px;color:#777;"
        >
          DROP-OFF
        </div>

        <div
          id="dropoff"
          class="location-text"
        >
          --
        </div>

      </div>

    </div>



    <!-- STATS -->

    <div
      id="stats"
      class="stats"
    >

      <div class="stat">

        <div class="stat-title">
          Distance
        </div>

        <div
          id="distance"
          class="stat-value"
        >
          --
        </div>

      </div>


      <div class="stat">

        <div class="stat-title">
          ETA
        </div>

        <div
          id="eta"
          class="stat-value"
        >
          --
        </div>

      </div>

    </div>



    <!-- COMPLETED -->

    <div
      id="completedBox"
      class="completed-box"
    >

      <div class="completed-icon">
        🏁
      </div>

      <div class="completed-title">
        Ride Completed
      </div>

      <div class="completed-text">
        This ride has ended.
      </div>

    </div>



    <!-- SHARE -->

    <button
      id="shareButton"
      class="share-btn"
      onclick="shareTrip()"
    >
      📤 Share Trip
    </button>


  </div>



  <!-- LEAFLET -->

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
  ></script>



  <script type="module">


    // ==========================================
    // FIREBASE
    // ==========================================

    import {
      initializeApp
    }
    from
      "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";


    import {
      getDatabase,
      ref,
      onValue
    }
    from
      "https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js";


    const firebaseConfig = {

      /*
        IMPORTANT:
        Put your SAME existing Firebase API key here.
        Do not create a new Firebase project.
      */

      apiKey:
        "AIzaSyCEaUviM45cSPcs8Te6G0PqsE5imFR2TYE",

      authDomain:
        "yango-tracking.firebaseapp.com",

      projectId:
        "yango-tracking",

      storageBucket:
        "yango-tracking.firebasestorage.app",

      messagingSenderId:
        "1019473211995",

      appId:
        "1:1019473211995:web:56a81d2fc43cda8dd5857e",

      databaseURL:
        "https://yango-tracking-default-rtdb.asia-southeast1.firebasedatabase.app"

    };


    const app =
      initializeApp(firebaseConfig);


    const database =
      getDatabase(app);



    // ==========================================
    // TRIP ID
    // ==========================================

    const params =
      new URLSearchParams(
        window.location.search
      );


    const tripId =
      params.get("trip") || "demo";



    // ==========================================
    // MAP
    // ==========================================

    const map =
      L.map("map").setView(
        [24.8607, 67.0011],
        12
      );


    L.tileLayer(
      "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
      {

        maxZoom: 19,

        attribution:
          "&copy; OpenStreetMap contributors"

      }
    ).addTo(map);



    // ==========================================
    // VARIABLES
    // ==========================================

    let driverMarker = null;

    let pickupMarker = null;

    let dropoffMarker = null;

    let routeLine = null;

    let lastRouteTime = 0;

    let lastDriverLat = null;

    let lastDriverLng = null;

    let currentTrip = null;



    // ==========================================
    // MARKERS
    // ==========================================

    const carIcon =
      L.divIcon({

        className: "",

        html:
          '<div class="car-marker">🚗</div>',

        iconSize:
          [48, 48],

        iconAnchor:
          [24, 24]

      });


    const pickupIcon =
      L.divIcon({

        className: "",

        html:
          '<div class="map-pin map-pickup">P</div>',

        iconSize:
          [34, 34],

        iconAnchor:
          [17, 17]

      });


    const dropoffIcon =
      L.divIcon({

        className: "",

        html:
          '<div class="map-pin map-dropoff">D</div>',

        iconSize:
          [34, 34],

        iconAnchor:
          [17, 17]

      });



    // ==========================================
    // FIREBASE LISTENER
    // ==========================================

    const tripRef =
      ref(
        database,
        "trips/" + tripId
      );


    onValue(
      tripRef,
      function(snapshot) {

        const trip =
          snapshot.val();


        if (!trip) {

          document
            .getElementById("statusText")
            .innerText =
            "Trip not found";

          return;

        }


        currentTrip = trip;


        updateTripInformation(
          trip
        );


        updateLocationMarkers(
          trip
        );


        handleTripState(
          trip
        );

      },

      function(error) {

        console.error(error);

        document
          .getElementById("statusText")
          .innerText =
          "Unable to load trip";

      }

    );



    // ==========================================
    // TRIP INFORMATION
    // ==========================================

    function updateTripInformation(
      trip
    ) {


      document
        .getElementById("driverName")
        .innerText =
        trip.driverName ||
        "Driver";


      document
        .getElementById("rating")
        .innerText =
        "⭐ " +
        (trip.rating || "--");


      document
        .getElementById("pickup")
        .innerText =
        trip.pickup ||
        "--";


      document
        .getElementById("dropoff")
        .innerText =
        trip.dropoff ||
        "--";


      document
        .getElementById("vehicle")
        .innerText =

        "🚗 " +

        (trip.vehicle || "Vehicle") +

        (
          trip.vehicleColor
            ? " • " + trip.vehicleColor
            : ""
        ) +

        (
          trip.plate
            ? " • " + trip.plate
            : ""
        );



      // DRIVER PHOTO

      const photoContainer =
        document
          .getElementById(
            "driverPhotoContainer"
          );


      if (trip.driverPhoto) {

        photoContainer.innerHTML =

          '<img class="driver-photo" ' +

          'src="' +
          escapeHtml(
            trip.driverPhoto
          ) +
          '" ' +

          'onerror="this.parentElement.innerHTML=\'<div class=&quot;driver-placeholder&quot;>👤</div>\'">';

      }

    }



    // ==========================================
    // UPDATE MAP MARKERS
    // ==========================================

    function updateLocationMarkers(
      trip
    ) {


      // PICKUP

      if (
        trip.pickupLocation &&
        typeof trip.pickupLocation.lat ===
          "number" &&
        typeof trip.pickupLocation.lng ===
          "number"
      ) {

        const lat =
          trip.pickupLocation.lat;

        const lng =
          trip.pickupLocation.lng;


        if (!pickupMarker) {

          pickupMarker =
            L.marker(
              [lat, lng],
              {
                icon:
                  pickupIcon
              }
            ).addTo(map);


          pickupMarker.bindPopup(
            "Pickup: " +
            (trip.pickup || "")
          );

        }

        else {

          pickupMarker.setLatLng(
            [lat, lng]
          );

        }

      }



      // DROP-OFF

      if (
        trip.dropoffLocation &&
        typeof trip.dropoffLocation.lat ===
          "number" &&
        typeof trip.dropoffLocation.lng ===
          "number"
      ) {

        const lat =
          trip.dropoffLocation.lat;

        const lng =
          trip.dropoffLocation.lng;


        if (!dropoffMarker) {

          dropoffMarker =
            L.marker(
              [lat, lng],
              {
                icon:
                  dropoffIcon
              }
            ).addTo(map);


          dropoffMarker.bindPopup(
            "Drop-off: " +
            (trip.dropoff || "")
          );

        }

        else {

          dropoffMarker.setLatLng(
            [lat, lng]
          );

        }

      }



      // DRIVER

      if (
        trip.location &&
        typeof trip.location.lat ===
          "number" &&
        typeof trip.location.lng ===
          "number"
      ) {

        const lat =
          trip.location.lat;

        const lng =
          trip.location.lng;


        if (!driverMarker) {

          driverMarker =
            L.marker(
              [lat, lng],
              {
                icon:
                  carIcon
              }
            ).addTo(map);


          driverMarker.bindPopup(
            "Driver location"
          );


          map.setView(
            [lat, lng],
            15
          );

        }

        else {

          driverMarker.setLatLng(
            [lat, lng]
          );

        }


        lastDriverLat =
          lat;

        lastDriverLng =
          lng;


        // UPDATE ROUTE

        updateRoute(
          trip
        );

      }

    }



    // ==========================================
    // TRIP STATUS
    // ==========================================

    function handleTripState(
      trip
    ) {

      const status =
        trip.status || "";


      const statusElement =
        document.getElementById(
          "status"
        );


      const statusText =
        document.getElementById(
          "statusText"
        );


      const stats =
        document.getElementById(
          "stats"
        );


      const completedBox =
        document.getElementById(
          "completedBox"
        );



      // COMPLETED

      if (
        status ===
        "Trip completed"
      ) {

        statusElement.className =
          "status completed";


        statusText.innerText =
          "Ride completed";


        completedBox.style.display =
          "block";


        stats.style.display =
          "none";


        removeRoute();


        return;

      }



      // GPS STOPPED

      if (
        trip.sharingActive === false
      ) {

        statusElement.className =
          "status stopped";


        statusText.innerText =
          "GPS sharing stopped";


        completedBox.style.display =
          "none";


        stats.style.display =
          "none";


        removeRoute();


        return;

      }



      // NORMAL RIDE

      statusElement.className =
        "status";


      statusText.innerText =
        status ||
        "Driver is on the way";


      completedBox.style.display =
        "none";


      stats.style.display =
        "flex";

    }



    // ==========================================
    // ROUTE
    // ==========================================

    async function updateRoute(
      trip
    ) {


      if (
        trip.status ===
        "Trip completed"
      ) {

        return;

      }


      if (
        trip.sharingActive === false
      ) {

        return;

      }


      if (
        lastDriverLat === null ||
        lastDriverLng === null
      ) {

        return;

      }



      let destination = null;


      /*
        Driver is on the way:
        Driver -> Pickup

        Trip started:
        Driver -> Drop-off
      */

      if (
        trip.status ===
        "Driver is on the way"
      ) {

        if (
          trip.pickupLocation
        ) {

          destination =
            trip.pickupLocation;

        }

      }


      else if (
        trip.status ===
        "Driver arrived"
      ) {

        if (
          trip.pickupLocation
        ) {

          destination =
            trip.pickupLocation;

        }

      }


      else if (
        trip.status ===
        "Trip started"
      ) {

        if (
          trip.dropoffLocation
        ) {

          destination =
            trip.dropoffLocation;

        }

      }



      if (!destination) {

        return;

      }



      // DON'T REQUEST TOO OFTEN

      const now =
        Date.now();


      if (
        now - lastRouteTime <
        15000
      ) {

        return;

      }


      lastRouteTime =
        now;



      try {

        const url =

          "https://router.project-osrm.org/route/v1/driving/" +

          lastDriverLng +
          "," +
          lastDriverLat +

          ";" +

          destination.lng +
          "," +
          destination.lat +

          "?overview=full&geometries=geojson";


        const response =
          await fetch(url);


        const data =
          await response.json();


        if (
          data.code !== "Ok" ||
          !data.routes ||
          !data.routes.length
        ) {

          return;

        }


        const route =
          data.routes[0];


        const distanceMeters =
          route.distance;


        const durationSeconds =
          route.duration;



        // DRAW ROUTE

        const coordinates =
          route.geometry.coordinates;


        const latLngs =
          coordinates.map(
            function(point) {

              return [
                point[1],
                point[0]
              ];

            }
          );


        if (routeLine) {

          routeLine.setLatLngs(
            latLngs
          );

        }

        else {

          routeLine =
            L.polyline(
              latLngs,
              {
                weight: 5,
                opacity: 0.8
              }
            ).addTo(map);

        }



        // DISTANCE

        document
          .getElementById("distance")
          .innerText =
          formatDistance(
            distanceMeters
          );



        // ETA

        document
          .getElementById("eta")
          .innerText =
          formatDuration(
            durationSeconds
          );

      }

      catch (error) {

        console.error(
          "Route error:",
          error
        );

      }

    }



    // ==========================================
    // REMOVE ROUTE
    // ==========================================

    function removeRoute() {

      if (routeLine) {

        map.removeLayer(
          routeLine
        );

        routeLine = null;

      }


      document
        .getElementById("distance")
        .innerText =
        "--";


      document
        .getElementById("eta")
        .innerText =
        "--";

    }



    // ==========================================
    // DISTANCE FORMAT
    // ==========================================

    function formatDistance(
      meters
    ) {

      if (
        meters < 1000
      ) {

        return (
          Math.round(
            meters
          ) +
          " m"
        );

      }


      return (
        (meters / 1000)
          .toFixed(1) +
        " km"
      );

    }



    // ==========================================
    // ETA FORMAT
    // ==========================================

    function formatDuration(
      seconds
    ) {

      const minutes =
        Math.round(
          seconds / 60
        );


      if (
        minutes < 1
      ) {

        return "<1 min";

      }


      if (
        minutes < 60
      ) {

        return (
          minutes +
          " min"
        );

      }


      const hours =
        Math.floor(
          minutes / 60
        );


      const remainingMinutes =
        minutes % 60;


      return (
        hours +
        "h " +
        remainingMinutes +
        "m"
      );

    }



    // ==========================================
    // DRIVER LOCATION BUTTON
    // ==========================================

    window.goToDriver =
      function() {

        if (!driverMarker) {

          alert(
            "Driver location is not available yet."
          );

          return;

        }


        map.setView(
          driverMarker.getLatLng(),
          16
        );

        driverMarker.openPopup();

      };



    // ==========================================
    // SHARE TRIP
    // ==========================================

    window.shareTrip =
      async function() {

        const shareUrl =
          window.location.href;


        if (
          navigator.share
        ) {

          try {

            await navigator.share({

              title:
                "Yango Tracking",

              text:
                "Track this ride",

              url:
                shareUrl

            });

          }

          catch (error) {

            console.log(
              "Share cancelled."
            );

          }

        }

        else {

          try {

            await navigator.clipboard
              .writeText(
                shareUrl
              );


            alert(
              "Tracking link copied!"
            );

          }

          catch (error) {

            prompt(
              "Copy this tracking link:",
              shareUrl
            );

          }

        }

      };



    // ==========================================
    // BASIC HTML ESCAPE
    // ==========================================

    function escapeHtml(
      value
    ) {

      return String(value)
        .replace(
          /&/g,
          "&amp;"
        )
        .replace(
          /</g,
          "&lt;"
        )
        .replace(
          />/g,
          "&gt;"
        )
        .replace(
          /"/g,
          "&quot;"
        )
        .replace(
          /'/g,
          "&#039;"
        );

    }

  </script>
