<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Yango Tracking</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    #map {
      width: 100%;
      height: 100%;
    }

    .top-bar {
      position: absolute;
      top: 15px;
      left: 15px;
      right: 15px;
      z-index: 1000;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
    }

    .brand {
      background: white;
      padding: 12px 15px;
      border-radius: 12px;
      box-shadow: 0 3px 12px rgba(0,0,0,.18);
      pointer-events: auto;
    }

    .brand strong {
      font-size: 18px;
    }

    .brand small {
      display: block;
      margin-top: 3px;
      color: #777;
    }

    .location-btn {
      background: white;
      border: none;
      padding: 12px 15px;
      border-radius: 12px;
      font-weight: bold;
      box-shadow: 0 3px 12px rgba(0,0,0,.18);
      cursor: pointer;
      pointer-events: auto;
    }

    .ride-card {
      position: absolute;
      left: 15px;
      right: 15px;
      bottom: 15px;
      z-index: 1000;
      background: white;
      border-radius: 18px;
      padding: 18px;
      box-shadow: 0 4px 20px rgba(0,0,0,.2);
    }

    .status {
      font-size: 14px;
      color: #555;
      margin-bottom: 8px;
    }

    .driver {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 5px;
    }

    .vehicle {
      color: #666;
      font-size: 14px;
    }

    .locations {
      margin-top: 14px;
      border-top: 1px solid #eee;
      padding-top: 12px;
      font-size: 14px;
    }

    .location-row {
      margin: 7px 0;
    }

    .label {
      color: #777;
      font-size: 12px;
      display: block;
    }

    .value {
      font-weight: bold;
    }

    .stats {
      display: flex;
      gap: 25px;
      margin-top: 14px;
    }

    .stat strong {
      display: block;
      font-size: 18px;
    }

    .stat span {
      font-size: 12px;
      color: #777;
    }

    .share-btn {
      width: 100%;
      margin-top: 15px;
      padding: 13px;
      border: none;
      border-radius: 10px;
      background: #111;
      color: white;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    .error {
      display: none;
      position: absolute;
      top: 90px;
      left: 15px;
      right: 15px;
      z-index: 1001;
      background: #fff0f0;
      color: #b00020;
      padding: 12px;
      border-radius: 10px;
      text-align: center;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <div id="map"></div>

  <div class="top-bar">

    <div class="brand">
      <strong>Yango Tracking</strong>
      <small id="tripDisplay">Loading trip...</small>
    </div>

    <button class="location-btn" onclick="findMyLocation()">
      📍 My Location
    </button>

  </div>

  <div id="errorBox" class="error"></div>

  <div class="ride-card">

    <div class="status" id="status">
      Connecting to trip...
    </div>

    <div class="driver" id="driverName">
      Driver
    </div>

    <div class="vehicle" id="vehicle">
      Loading vehicle...
    </div>

    <div class="locations">

      <div class="location-row">
        <span class="label">PICKUP</span>
        <span class="value" id="pickup">Loading...</span>
      </div>

      <div class="location-row">
        <span class="label">DROP-OFF</span>
        <span class="value" id="dropoff">Loading...</span>
      </div>

    </div>

    <div class="stats">

      <div class="stat">
        <strong id="eta">--</strong>
        <span>ETA</span>
      </div>

      <div class="stat">
        <strong id="distance">--</strong>
        <span>DISTANCE</span>
      </div>

    </div>

    <button class="share-btn" onclick="shareTrip()">
      Share Trip
    </button>

  </div>


  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>


  <script type="module">

    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";

    import {
      getDatabase,
      ref,
      onValue
    }
      from "https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js";


    /*
      IMPORTANT:
      Keep the SAME Firebase configuration
      from your previous working index.html.
    */

    const firebaseConfig = {

      apiKey: "AIzaSyCEaUviM45cSPcs8Te6G0PqsE5imFR2TYE",

      authDomain: "yango-tracking.firebaseapp.com",

      projectId: "yango-tracking",

      storageBucket: "yango-tracking.firebasestorage.app",

      messagingSenderId: "1019473211995",

      appId: "1:1019473211995:web:56a81d2fc43cda8dd5857e",

      databaseURL:
        "https://yango-tracking-default-rtdb.asia-southeast1.firebasedatabase.app"

    };


    const app = initializeApp(firebaseConfig);

    const database = getDatabase(app);


    /*
      GET TRIP ID FROM URL

      Example:

      ?trip=trip001

      If no trip is supplied,
      use demo.
    */

    const params = new URLSearchParams(
      window.location.search
    );

    const tripId =
      params.get("trip") || "demo";


    document.getElementById("tripDisplay").textContent =
      "Trip ID: " + tripId;


    /*
      MAP
    */

    const map = L.map("map").setView(
      [24.8607, 67.0011],
      13
    );


    L.tileLayer(
      "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
      {
        maxZoom: 19,
        attribution: "&copy; OpenStreetMap contributors"
      }
    ).addTo(map);


    let driverMarker = null;

    let firstLocation = true;


    /*
      LISTEN FOR TRIP DETAILS
    */

    const tripRef =
      ref(database, "trips/" + tripId);


    onValue(tripRef, (snapshot) => {

      const trip = snapshot.val();

      if (!trip) {

        showError(
          "Trip not found. Please check the tracking link."
        );

        return;

      }


      document.getElementById("status").textContent =
        trip.status || "Driver is on the way";


      document.getElementById("driverName").textContent =
        trip.driverName || "Driver";


      document.getElementById("vehicle").textContent =
        [
          trip.vehicle,
          trip.vehicleColor,
          trip.plate
        ]
        .filter(Boolean)
        .join(" • ") ||
        "Vehicle information unavailable";


      document.getElementById("pickup").textContent =
        trip.pickup || "Pickup location";


      document.getElementById("dropoff").textContent =
        trip.dropoff || "Drop-off location";

    });


    /*
      LISTEN FOR REAL DRIVER GPS
    */

    const locationRef =
      ref(database, "trips/" + tripId + "/location");


    onValue(locationRef, (snapshot) => {

      const location = snapshot.val();


      if (!location) {

        document.getElementById("status").textContent =
          "Waiting for driver's GPS...";

        return;

      }


      const lat = Number(location.lat);

      const lng = Number(location.lng);


      if (
        !Number.isFinite(lat) ||
        !Number.isFinite(lng)
      ) {

        return;

      }


      /*
        CREATE DRIVER MARKER
      */

      if (!driverMarker) {

        driverMarker =
          L.marker([lat, lng])
            .addTo(map)
            .bindPopup(
              "🚗 Driver live location"
            );

      } else {

        driverMarker.setLatLng([
          lat,
          lng
        ]);

      }


      /*
        Automatically move map
        to driver the FIRST time
        GPS is received.
      */

      if (firstLocation) {

        map.setView(
          [lat, lng],
          16
        );

        firstLocation = false;

      }


      /*
        GPS status
      */

      document.getElementById("status").textContent =
        "🟢 Driver location is live";


    });


    /*
      VIEWER'S OWN LOCATION
    */

    window.findMyLocation = function() {

      if (!navigator.geolocation) {

        alert(
          "Location is not supported on this device."
        );

        return;

      }


      navigator.geolocation.getCurrentPosition(

        (position) => {

          const lat =
            position.coords.latitude;

          const lng =
            position.coords.longitude;


          L.marker([lat, lng])
            .addTo(map)
            .bindPopup(
              "📍 Your location"
            )
            .openPopup();


          map.setView(
            [lat, lng],
            16
          );

        },

        () => {

          alert(
            "Please allow location access."
          );

        }

      );

    };


    /*
      SHARE
    */

    window.shareTrip = async function() {

      const link =
        window.location.href;


      if (navigator.share) {

        try {

          await navigator.share({

            title:
              "Live Trip Tracking",

            text:
              "Track this trip live:",

            url:
              link

          });

        } catch (error) {

          console.log(error);

        }

      } else {

        try {

          await navigator.clipboard.writeText(
            link
          );

          alert(
            "Tracking link copied!"
          );

        } catch (error) {

          prompt(
            "Copy this tracking link:",
            link
          );

        }

      }

    };


    function showError(message) {

      const box =
        document.getElementById("errorBox");

      box.textContent = message;

      box.style.display = "block";

    }

  </script>

</body>
</html>
