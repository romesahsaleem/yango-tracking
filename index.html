<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>Yango Tracking</title>

  <!-- Leaflet Map -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >

  <style>

    /* ================================
       BASIC
    ================================= */

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;

      width: 100%;
      height: 100%;

      overflow: hidden;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      background: #f5f5f5;
    }


    /* ================================
       MAP
    ================================= */

    #map {
      position: fixed;

      inset: 0;

      width: 100%;
      height: 100%;

      z-index: 1;
    }


    /* ================================
       YANGO STYLE WORDMARK
    ================================= */

    .logo {
      position: fixed;

      top: 17px;
      left: 18px;

      z-index: 1000;

      font-size: 29px;

      font-weight: 900;

      font-style: italic;

      letter-spacing: -2px;

      color: #e00000;

      text-shadow:
        0 1px 3px rgba(255,255,255,0.9);

      pointer-events: none;
    }


    /* ================================
       MAP LOCATION BUTTON
    ================================= */

    .location-button {
      position: fixed;

      right: 17px;
      bottom: 51%;

      z-index: 1000;

      width: 50px;
      height: 50px;

      border: none;

      border-radius: 50%;

      background: white;

      box-shadow:
        0 3px 16px rgba(0,0,0,0.22);

      font-size: 23px;

      cursor: pointer;

      display: flex;

      align-items: center;
      justify-content: center;
    }

    .location-button:active {
      transform: scale(0.94);
    }


    /* ================================
       DRIVER CAR MARKER
    ================================= */

    .car-marker {
      width: 48px;
      height: 48px;

      border-radius: 50%;

      background: #f5c400;

      border: 4px solid white;

      box-shadow:
        0 3px 12px rgba(0,0,0,0.35);

      display: flex;

      align-items: center;
      justify-content: center;

      font-size: 25px;
    }


    /* ================================
       PICKUP MARKER
    ================================= */

    .pickup-marker {
      width: 38px;
      height: 38px;

      border-radius: 50% 50% 50% 0;

      background: #222;

      color: white;

      border: 3px solid white;

      box-shadow:
        0 3px 10px rgba(0,0,0,0.35);

      display: flex;

      align-items: center;
      justify-content: center;

      font-weight: bold;

      transform: rotate(-45deg);
    }

    .pickup-marker span {
      transform: rotate(45deg);
    }


    /* ================================
       DROP OFF MARKER
    ================================= */

    .dropoff-marker {
      width: 38px;
      height: 38px;

      border-radius: 50% 50% 50% 0;

      background: #e00000;

      color: white;

      border: 3px solid white;

      box-shadow:
        0 3px 10px rgba(0,0,0,0.35);

      display: flex;

      align-items: center;
      justify-content: center;

      font-size: 16px;

      transform: rotate(-45deg);
    }

    .dropoff-marker span {
      transform: rotate(45deg);
    }


    /* ================================
       BOTTOM SHEET
    ================================= */

    .bottom-sheet {
      position: fixed;

      left: 0;
      right: 0;
      bottom: 0;

      z-index: 900;

      width: 100%;

      height: 50vh;

      min-height: 350px;

      background: white;

      border-radius:
        28px 28px 0 0;

      box-shadow:
        0 -5px 25px rgba(0,0,0,0.18);

      overflow-y: auto;

      overflow-x: hidden;

      -webkit-overflow-scrolling: touch;
    }


    .bottom-sheet::-webkit-scrollbar {
      width: 5px;
    }

    .bottom-sheet::-webkit-scrollbar-thumb {
      background: #ccc;

      border-radius: 10px;
    }


    /* ================================
       HANDLE
    ================================= */

    .sheet-handle {
      width: 48px;
      height: 5px;

      background: #d0d0d0;

      border-radius: 10px;

      margin:
        10px auto 7px;
    }


    /* ================================
       TOP SUMMARY
    ================================= */

    .ride-summary {
      padding:
        8px 20px 18px;

      border-bottom:
        1px solid #eeeeee;
    }


    .summary-row {
      display: flex;

      align-items: center;

      gap: 14px;
    }


    .summary-car {
      width: 56px;
      height: 56px;

      border-radius: 50%;

      background: #f1f1f1;

      display: flex;

      align-items: center;
      justify-content: center;

      font-size: 28px;

      flex-shrink: 0;
    }


    .summary-text {
      flex: 1;

      min-width: 0;
    }


    .main-status {
      font-size: 20px;

      line-height: 1.2;

      font-weight: 700;

      color: #171717;

      margin-bottom: 6px;
    }


    .vehicle-short {
      color: #777;

      font-size: 15px;

      white-space: nowrap;

      overflow: hidden;

      text-overflow: ellipsis;
    }


    .summary-arrow {
      font-size: 30px;

      color: #777;
    }


    /* ================================
       SECTION TITLE
    ================================= */

    .section-title {
      background: #f4f4f4;

      padding:
        9px 20px;

      color: #666;

      font-size: 14px;

      font-weight: 600;
    }


    /* ================================
       RIDE DETAILS
    ================================= */

    .details-container {
      padding:
        18px 20px 8px;
    }


    .location-item {
      display: flex;

      position: relative;

      gap: 14px;

      padding-bottom: 21px;
    }


    .location-icon-column {
      width: 34px;

      display: flex;

      justify-content: center;

      flex-shrink: 0;

      position: relative;
    }


    .location-icon {
      width: 34px;
      height: 34px;

      border-radius: 50%;

      display: flex;

      align-items: center;
      justify-content: center;

      color: white;

      font-size: 13px;

      font-weight: bold;

      position: relative;

      z-index: 2;
    }


    .pickup-icon {
      background: #e83b32;
    }


    .dropoff-icon {
      background: #222;
    }


    .location-connector {
      position: absolute;

      top: 34px;
      bottom: -2px;

      left: 16px;

      width: 2px;

      background: #d4d4d4;
    }


    .location-info {
      flex: 1;

      padding-top: 1px;
    }


    .location-label {
      font-size: 11px;

      color: #999;

      margin-bottom: 4px;

      text-transform: uppercase;

      letter-spacing: 0.5px;
    }


    .location-name {
      font-size: 16px;

      line-height: 1.35;

      color: #202020;

      font-weight: 500;
    }


    /* ================================
       DRIVER
    ================================= */

    .driver-section {
      border-top:
        1px solid #eeeeee;
    }


    .driver-content {
      padding:
        18px 20px;
    }


    .driver-row {
      display: flex;

      align-items: center;

      gap: 15px;
    }


    .driver-photo {
      width: 58px;
      height: 58px;

      border-radius: 50%;

      object-fit: cover;

      background: #eeeeee;
    }


    .driver-placeholder {
      width: 58px;
      height: 58px;

      border-radius: 50%;

      background: #eeeeee;

      display: flex;

      align-items: center;
      justify-content: center;

      font-size: 27px;
    }


    .driver-name {
      font-size: 19px;

      font-weight: 600;

      color: #222;
    }


    .driver-rating {
      margin-top: 5px;

      font-size: 15px;

      color: #555;
    }


    .star {
      color: #f2b900;

      font-size: 18px;
    }


    /* ================================
       VEHICLE INFORMATION
    ================================= */

    .info-section {
      border-top:
        1px solid #eeeeee;
    }


    .info-row {
      display: flex;

      align-items: center;

      gap: 14px;

      padding:
        16px 20px;

      border-bottom:
        1px solid #eeeeee;
    }


    .info-icon {
      width: 40px;
      height: 40px;

      border-radius: 50%;

      background: #f2f2f2;

      display: flex;

      align-items: center;
      justify-content: center;

      font-size: 20px;

      flex-shrink: 0;
    }


    .info-text {
      flex: 1;
    }


    .info-label {
      font-size: 12px;

      color: #999;

      margin-bottom: 3px;
    }


    .info-value {
      font-size: 17px;

      color: #222;

      font-weight: 500;
    }


    /* ================================
       GPS STOPPED
    ================================= */

    .stopped-box {
      display: none;

      padding:
        16px 20px;

      background: #fff3f3;

      color: #a00000;

      border-top:
        1px solid #f1d4d4;

      border-bottom:
        1px solid #f1d4d4;

      font-size: 14px;

      font-weight: 600;
    }


    /* ================================
       COMPLETED
    ================================= */

    .completed-box {
      display: none;

      text-align: center;

      padding:
        28px 20px;

      border-top:
        1px solid #eeeeee;
    }


    .completed-icon {
      font-size: 38px;

      margin-bottom: 8px;
    }


    .completed-title {
      font-size: 21px;

      font-weight: 700;

      color: #222;
    }


    .completed-subtitle {
      color: #777;

      margin-top: 6px;

      font-size: 14px;
    }


    /* ================================
       SHARE BUTTON
    ================================= */

    .share-area {
      padding:
        20px;
    }


    .share-button {
      width: 100%;

      height: 50px;

      border: none;

      border-radius: 12px;

      background: #111;

      color: white;

      font-size: 16px;

      font-weight: 600;

      cursor: pointer;
    }


    .share-button:active {
      transform: scale(0.98);
    }


    /* ================================
       MOBILE
    ================================= */

    @media (max-width: 600px) {

      .logo {
        top: 14px;
        left: 16px;

        font-size: 28px;
      }

      .location-button {
        right: 14px;

        bottom: 51%;

        width: 48px;
        height: 48px;
      }

      .bottom-sheet {
        height: 52vh;

        min-height: 350px;

        border-radius:
          25px 25px 0 0;
      }

      .main-status {
        font-size: 20px;
      }

      .location-name {
        font-size: 15px;
      }

    }


    /* ================================
       DESKTOP
    ================================= */

    @media (min-width: 900px) {

      .bottom-sheet {
        width: 520px;

        left: 20px;

        right: auto;

        bottom: 20px;

        height: 58vh;

        border-radius: 25px;
      }

      .location-button {
        right: 25px;

        bottom: 60px;
      }

    }

  </style>

</head>


<body>


  <!-- ================================
       MAP
  ================================= -->

  <div id="map"></div>


  <!-- ================================
       LOGO
  ================================= -->

  <div class="logo">
    YANGO
  </div>


  <!-- ================================
       LOCATION BUTTON
  ================================= -->

  <button
    class="location-button"
    id="locationButton"
    title="Show driver location"
  >
    🚗
  </button>


  <!-- ================================
       BOTTOM SHEET
  ================================= -->

  <div
    class="bottom-sheet"
    id="bottomSheet"
  >

    <div class="sheet-handle"></div>


    <!-- ============================
         RIDE SUMMARY
    ============================= -->

    <div class="ride-summary">

      <div class="summary-row">

        <div class="summary-car">
          🚗
        </div>

        <div class="summary-text">

          <div
            class="main-status"
            id="mainStatus"
          >
            Loading trip...
          </div>

          <div
            class="vehicle-short"
            id="vehicleShort"
          >
            --
          </div>

        </div>

        <div class="summary-arrow">
          ›
        </div>

      </div>

    </div>


    <!-- ============================
         GPS STOPPED
    ============================= -->

    <div
      class="stopped-box"
      id="stoppedBox"
    >
      🛑 GPS sharing has stopped.
    </div>


    <!-- ============================
         RIDE DETAILS
    ============================= -->

    <div class="section-title">
      Ride details
    </div>


    <div class="details-container">


      <!-- PICKUP -->

      <div class="location-item">

        <div class="location-icon-column">

          <div class="location-icon pickup-icon">
            P
          </div>

          <div class="location-connector"></div>

        </div>


        <div class="location-info">

          <div class="location-label">
            Pickup
          </div>

          <div
            class="location-name"
            id="pickup"
          >
            --
          </div>

        </div>

      </div>


      <!-- DROP OFF -->

      <div class="location-item">

        <div class="location-icon-column">

          <div class="location-icon dropoff-icon">
            D
          </div>

        </div>


        <div class="location-info">

          <div class="location-label">
            Drop-off
          </div>

          <div
            class="location-name"
            id="dropoff"
          >
            --
          </div>

        </div>

      </div>

    </div>


    <!-- ============================
         DRIVER
    ============================= -->

    <div class="driver-section">

      <div class="section-title">
        Driver
      </div>


      <div class="driver-content">

        <div class="driver-row">

          <div id="driverPhotoContainer">

            <div class="driver-placeholder">
              👤
            </div>

          </div>


          <div>

            <div
              class="driver-name"
              id="driverName"
            >
              --
            </div>


            <div
              class="driver-rating"
              id="driverRating"
            >
              <span class="star">★</span>
              --
            </div>

          </div>

        </div>

      </div>

    </div>


    <!-- ============================
         VEHICLE
    ============================= -->

    <div class="info-section">

      <div class="section-title">
        Vehicle
      </div>


      <div class="info-row">

        <div class="info-icon">
          🚗
        </div>

        <div class="info-text">

          <div class="info-label">
            Vehicle
          </div>

          <div
            class="info-value"
            id="vehicleName"
          >
            --
          </div>

        </div>

      </div>


      <!-- LICENSE PLATE -->

      <div class="info-row">

        <div class="info-icon">
          ▣
        </div>

        <div class="info-text">

          <div class="info-label">
            License plate number
          </div>

          <div
            class="info-value"
            id="plate"
          >
            --
          </div>

        </div>

      </div>

    </div>


    <!-- ============================
         COMPLETED
    ============================= -->

    <div
      class="completed-box"
      id="completedBox"
    >

      <div class="completed-icon">
        🏁
      </div>

      <div class="completed-title">
        Ride Completed
      </div>

      <div class="completed-subtitle">
        This ride has ended.
      </div>

    </div>


    <!-- ============================
         SHARE
    ============================= -->

    <div class="share-area">

      <button
        class="share-button"
        id="shareButton"
      >
        📤 Share Trip
      </button>

    </div>


  </div>


  <!-- ================================
       LEAFLET
  ================================= -->

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
  ></script>


  <!-- ================================
       FIREBASE
  ================================= -->

  <script type="module">


    import {
      initializeApp
    }
    from
      "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";


    import {
      getDatabase,
      ref,
      onValue
    }
    from
      "https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js";


    /* ================================
       FIREBASE CONFIG
    ================================= */

    const firebaseConfig = {

      /*
       * USE THE SAME API KEY YOU
       * ALREADY HAVE IN YOUR PROJECT.
       */

      apiKey:
        "AIzaSyCEaUviM45cSPcs8Te6G0PqsE5imFR2TYE",

      authDomain:
        "yango-tracking.firebaseapp.com",

      projectId:
        "yango-tracking",

      storageBucket:
        "yango-tracking.firebasestorage.app",

      messagingSenderId:
        "1019473211995",

      appId:
        "1:1019473211995:web:56a81d2fc43cda8dd5857e",

      databaseURL:
        "https://yango-tracking-default-rtdb.asia-southeast1.firebasedatabase.app"

    };


    const app =
      initializeApp(
        firebaseConfig
      );


    const database =
      getDatabase(app);


    /* ================================
       TRIP ID
    ================================= */

    const params =
      new URLSearchParams(
        window.location.search
      );


    const tripId =
      params.get("trip") || "demo";


    /* ================================
       MAP
    ================================= */

    const map =
      L.map(
        "map",
        {
          zoomControl: false
        }
      ).setView(
        [24.8607, 67.0011],
        13
      );


    L.tileLayer(
      "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
      {
        maxZoom: 19,

        attribution:
          "&copy; OpenStreetMap contributors"
      }
    ).addTo(map);


    /* ================================
       VARIABLES
    ================================= */

    let driverMarker = null;

    let pickupMarker = null;

    let dropoffMarker = null;

    let routeLine = null;

    let firstDriverLocation = true;

    let lastRouteRequest = 0;


    /* ================================
       DRIVER ICON
    ================================= */

    const carIcon =
      L.divIcon({

        className: "",

        html:
          '<div class="car-marker">🚗</div>',

        iconSize:
          [48, 48],

        iconAnchor:
          [24, 24]
      });


    /* ================================
       PICKUP ICON
    ================================= */

    const pickupIcon =
      L.divIcon({

        className: "",

        html:
          '<div class="pickup-marker">' +
          '<span>P</span>' +
          '</div>',

        iconSize:
          [38, 38],

        iconAnchor:
          [19, 38]
      });


    /* ================================
       DROP OFF ICON
    ================================= */

    const dropoffIcon =
      L.divIcon({

        className: "",

        html:
          '<div class="dropoff-marker">' +
          '<span>⚑</span>' +
          '</div>',

        iconSize:
          [38, 38],

        iconAnchor:
          [19, 38]
      });


    /* ================================
       FIREBASE LISTENER
    ================================= */

    const tripRef =
      ref(
        database,
        "trips/" + tripId
      );


    onValue(

      tripRef,

      function(snapshot) {

        const trip =
          snapshot.val();


        if (!trip) {

          document
            .getElementById("mainStatus")
            .innerText =
            "Trip not found";

          return;
        }


        updateDetails(
          trip
        );


        updateMap(
          trip
        );


        updateTripStatus(
          trip
        );

      },

      function(error) {

        console.error(
          error
        );

        document
          .getElementById("mainStatus")
          .innerText =
          "Unable to load trip";

      }

    );


    /* ================================
       UPDATE DETAILS
    ================================= */

    function updateDetails(trip) {

      document
        .getElementById("pickup")
        .innerText =
        trip.pickup || "--";


      document
        .getElementById("dropoff")
        .innerText =
        trip.dropoff || "--";


      document
        .getElementById("driverName")
        .innerText =
        trip.driverName || "Driver";


      document
        .getElementById("driverRating")
        .innerHTML =
        '<span class="star">★</span> ' +
        (trip.rating || "--");


      document
        .getElementById("vehicleName")
        .innerText =
        trip.vehicle || "--";


      document
        .getElementById("plate")
        .innerText =
        trip.plate || "--";


      document
        .getElementById("vehicleShort")
        .innerText =

        (trip.vehicle || "Vehicle") +

        (
          trip.plate
            ? " • " + trip.plate
            : ""
        );


      /* DRIVER PHOTO */

      const container =
        document
          .getElementById(
            "driverPhotoContainer"
          );


      if (trip.driverPhoto) {

        container.innerHTML = "";


        const image =
          document.createElement(
            "img"
          );


        image.className =
          "driver-photo";


        image.src =
          trip.driverPhoto;


        image.alt =
          "Driver";


        image.onerror =
          function() {

            container.innerHTML =
              '<div class="driver-placeholder">👤</div>';

          };


        container.appendChild(
          image
        );

      }

    }


    /* ================================
       UPDATE MAP
    ================================= */

    function updateMap(trip) {


      /* PICKUP */

      if (
        trip.pickupLocation &&
        typeof trip.pickupLocation.lat ===
          "number" &&
        typeof trip.pickupLocation.lng ===
          "number"
      ) {

        const position = [

          trip.pickupLocation.lat,

          trip.pickupLocation.lng

        ];


        if (!pickupMarker) {

          pickupMarker =
            L.marker(
              position,
              {
                icon:
                  pickupIcon
              }
            ).addTo(map);

        } else {

          pickupMarker
            .setLatLng(
              position
            );

        }


        pickupMarker.bindPopup(
          "<b>Pickup</b><br>" +
          escapeHtml(
            trip.pickup || ""
          )
        );

      }


      /* DROP OFF */

      if (
        trip.dropoffLocation &&
        typeof trip.dropoffLocation.lat ===
          "number" &&
        typeof trip.dropoffLocation.lng ===
          "number"
      ) {

        const position = [

          trip.dropoffLocation.lat,

          trip.dropoffLocation.lng

        ];


        if (!dropoffMarker) {

          dropoffMarker =
            L.marker(
              position,
              {
                icon:
                  dropoffIcon
              }
            ).addTo(map);

        } else {

          dropoffMarker
            .setLatLng(
              position
            );

        }


        dropoffMarker.bindPopup(
          "<b>Drop-off</b><br>" +
          escapeHtml(
            trip.dropoff || ""
          )
        );

      }


      /* DRIVER */

      if (
        trip.location &&
        typeof trip.location.lat ===
          "number" &&
        typeof trip.location.lng ===
          "number"
      ) {

        const position = [

          trip.location.lat,

          trip.location.lng

        ];


        if (!driverMarker) {

          driverMarker =
            L.marker(
              position,
              {
                icon:
                  carIcon
              }
            ).addTo(map);


          if (firstDriverLocation) {

            map.setView(
              position,
              15
            );

            firstDriverLocation =
              false;
          }

        } else {

          driverMarker
            .setLatLng(
              position
            );

        }


        requestRoute(
          trip
        );

      }

    }


    /* ================================
       STATUS
    ================================= */

    function updateTripStatus(trip) {

      const status =
        trip.status ||
        "Driver is on the way";


      const mainStatus =
        document
          .getElementById(
            "mainStatus"
          );


      const stoppedBox =
        document
          .getElementById(
            "stoppedBox"
          );


      const completedBox =
        document
          .getElementById(
            "completedBox"
          );


      /* COMPLETED */

      if (
        status ===
        "Trip completed"
      ) {

        mainStatus.innerText =
          "Ride completed";


        stoppedBox.style.display =
          "none";


        completedBox.style.display =
          "block";


        removeRoute();

        return;
      }


      /* GPS STOPPED */

      if (
        trip.sharingActive === false
      ) {

        mainStatus.innerText =
          "GPS sharing stopped";


        stoppedBox.style.display =
          "block";


        completedBox.style.display =
          "none";


        removeRoute();

        return;
      }


      stoppedBox.style.display =
        "none";


      completedBox.style.display =
        "none";


      /* NORMAL STATUS */

      if (
        status ===
        "Driver arrived"
      ) {

        mainStatus.innerText =
          "Driver has arrived";

      }

      else if (
        status ===
        "Trip started"
      ) {

        mainStatus.innerText =
          "Trip in progress";

      }

      else {

        mainStatus.innerText =
          "Driver on the way";

      }

    }


    /* ================================
       ROUTE
    ================================= */

    async function requestRoute(trip) {

      if (!trip.location) {
        return;
      }


      if (
        trip.status ===
        "Trip completed"
      ) {
        return;
      }


      if (
        trip.sharingActive === false
      ) {
        return;
      }


      let destination =
        null;


      /* DRIVER TO PICKUP */

      if (
        trip.status ===
          "Driver is on the way" ||
        !trip.status
      ) {

        if (
          trip.pickupLocation
        ) {

          destination =
            trip.pickupLocation;

        }

      }


      /* DRIVER ARRIVED */

      else if (
        trip.status ===
        "Driver arrived"
      ) {

        removeRoute();

        return;

      }


      /* DRIVER TO DROP OFF */

      else if (
        trip.status ===
        "Trip started"
      ) {

        if (
          trip.dropoffLocation
        ) {

          destination =
            trip.dropoffLocation;

        }

      }


      if (!destination) {
        return;
      }


      /* ROUTE REQUEST LIMIT */

      const now =
        Date.now();


      if (
        now -
        lastRouteRequest <
        15000
      ) {
        return;
      }


      lastRouteRequest =
        now;


      try {

        const driverLat =
          trip.location.lat;

        const driverLng =
          trip.location.lng;

        const destinationLat =
          destination.lat;

        const destinationLng =
          destination.lng;


        const url =

          "https://router.project-osrm.org/route/v1/driving/" +

          driverLng +
          "," +
          driverLat +

          ";" +

          destinationLng +
          "," +
          destinationLat +

          "?overview=full&geometries=geojson";


        const response =
          await fetch(
            url
          );


        const data =
          await response.json();


        if (
          data.code !== "Ok" ||
          !data.routes ||
          !data.routes.length
        ) {
          return;
        }


        const route =
          data.routes[0];


        /* ETA */

        const etaText =
          formatDuration(
            route.duration
          );


        const mainStatus =
          document
            .getElementById(
              "mainStatus"
            );


        if (
          trip.status ===
          "Trip started"
        ) {

          mainStatus.innerText =
            "Trip in progress, " +
            etaText +
            " left";

        } else {

          mainStatus.innerText =
            "Driver on the way, " +
            etaText +
            " left";

        }


        /* ROUTE LINE */

        const coordinates =
          route.geometry.coordinates;


        const latLngs =
          coordinates.map(
            function(point) {

              return [
                point[1],
                point[0]
              ];

            }
          );


        if (routeLine) {

          routeLine.setLatLngs(
            latLngs
          );

        } else {

          routeLine =
            L.polyline(
              latLngs,
              {
                color:
                  "#444444",

                weight:
                  5,

                opacity:
                  0.82,

                lineCap:
                  "round",

                lineJoin:
                  "round"
              }
            ).addTo(map);

        }

      }

      catch (error) {

        console.error(
          "Route error:",
          error
        );

      }

    }


    /* ================================
       REMOVE ROUTE
    ================================= */

    function removeRoute() {

      if (routeLine) {

        map.removeLayer(
          routeLine
        );

        routeLine =
          null;
      }

    }


    /* ================================
       FORMAT ETA
    ================================= */

    function formatDuration(seconds) {

      const minutes =
        Math.round(
          seconds / 60
        );


      if (minutes <= 0) {
        return "<1 min";
      }


      if (minutes < 60) {

        return (
          minutes +
          " min"
        );

      }


      const hours =
        Math.floor(
          minutes / 60
        );


      const remaining =
        minutes % 60;


      if (remaining === 0) {

        return (
          hours +
          "h"
        );

      }


      return (
        hours +
        "h " +
        remaining +
        " min"
      );

    }


    /* ================================
       LOCATION BUTTON
    ================================= */

    document
      .getElementById(
        "locationButton"
      )
      .addEventListener(
        "click",
        function() {

          if (!driverMarker) {
            return;
          }


          map.setView(
            driverMarker.getLatLng(),
            16,
            {
              animate:
                true
            }
          );

        }
      );


    /* ================================
       SHARE BUTTON
    ================================= */

    document
      .getElementById(
        "shareButton"
      )
      .addEventListener(
        "click",
        async function() {

          const shareUrl =
            window.location.href;


          if (
            navigator.share
          ) {

            try {

              await navigator.share({

                title:
                  "Yango Tracking",

                text:
                  "Track this ride",

                url:
                  shareUrl

              });

            }

            catch (error) {

              console.log(
                "Share cancelled"
              );

            }

          }

          else {

            try {

              await navigator
                .clipboard
                .writeText(
                  shareUrl
                );


              alert(
                "Tracking link copied!"
              );

            }

            catch (error) {

              prompt(
                "Copy this tracking link:",
                shareUrl
              );

            }

          }

        }
      );


    /* ================================
       HTML SAFETY
    ================================= */

    function escapeHtml(value) {

      return String(value)

        .replace(
          /&/g,
          "&amp;"
        )

        .replace(
          /</g,
          "&lt;"
        )

        .replace(
          />/g,
          "&gt;"
        )

        .replace(
          /"/g,
          "&quot;"
        )

        .replace(
          /'/g,
          "&#039;"
        );

    }

  </script>
