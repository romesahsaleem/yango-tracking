<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>YANGO Driver GPS</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f5f5;
      color: #111;
    }

    .header {
      background: #fff;
      padding: 18px 20px;
      border-bottom: 1px solid #e5e5e5;
      text-align: center;
    }

    .logo {
      color: #e00000;
      font-size: 28px;
      font-weight: 900;
      letter-spacing: 2px;
    }

    .subtitle {
      margin-top: 4px;
      color: #777;
      font-size: 13px;
    }

    .container {
      max-width: 520px;
      margin: 0 auto;
      padding: 20px 16px 35px;
    }

    .status-card {
      background: #fff;
      border-radius: 18px;
      padding: 22px;
      box-shadow: 0 3px 15px rgba(0, 0, 0, 0.07);
      margin-bottom: 16px;
      text-align: center;
    }

    .status {
      display: inline-block;
      padding: 10px 16px;
      border-radius: 999px;
      background: #fff4d6;
      color: #8a6500;
      font-size: 14px;
      font-weight: 700;
    }

    .status.live {
      background: #e8f8ed;
      color: #16843b;
    }

    .status.stopped {
      background: #f2f2f2;
      color: #666;
    }

    .status.completed {
      background: #e9e9e9;
      color: #333;
    }

    .trip-id {
      margin-top: 15px;
      color: #777;
      font-size: 13px;
    }

    .trip-id strong {
      color: #111;
    }

    .gps-card {
      background: #fff;
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 3px 15px rgba(0, 0, 0, 0.07);
      margin-bottom: 16px;
    }

    .section-title {
      font-size: 16px;
      font-weight: 800;
      margin-bottom: 16px;
    }

    .gps-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .gps-item {
      background: #f7f7f7;
      border-radius: 13px;
      padding: 14px;
    }

    .gps-label {
      color: #888;
      font-size: 12px;
      margin-bottom: 6px;
    }

    .gps-value {
      font-size: 15px;
      font-weight: 700;
      word-break: break-word;
    }

    .button {
      width: 100%;
      border: none;
      border-radius: 15px;
      padding: 17px;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      transition: 0.2s;
    }

    .button:active {
      transform: scale(0.98);
    }

    .stop-button {
      background: #111;
      color: #fff;
      margin-top: 4px;
    }

    .stop-button:disabled {
      background: #ddd;
      color: #888;
      cursor: not-allowed;
    }

    .message {
      display: none;
      margin-top: 16px;
      padding: 15px;
      border-radius: 13px;
      background: #fff;
      font-size: 14px;
      line-height: 1.5;
      text-align: center;
    }

    .message.show {
      display: block;
    }

    .message.success {
      background: #e8f8ed;
      color: #176b35;
    }

    .message.error {
      background: #fff0f0;
      color: #a30000;
    }

    .completed-box {
      display: none;
      background: #fff;
      border-radius: 18px;
      padding: 22px;
      text-align: center;
      box-shadow: 0 3px 15px rgba(0, 0, 0, 0.07);
    }

    .completed-box.show {
      display: block;
    }

    .completed-icon {
      font-size: 42px;
      margin-bottom: 10px;
    }

    .completed-title {
      font-size: 20px;
      font-weight: 800;
      margin-bottom: 7px;
    }

    .completed-text {
      color: #777;
      font-size: 14px;
      line-height: 1.5;
    }

    @media (max-width: 380px) {
      .gps-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <div class="header">
    <div class="logo">YANGO</div>
    <div class="subtitle">Driver GPS</div>
  </div>

  <div class="container">

    <div class="status-card">

      <div id="statusBadge" class="status">
        Starting GPS…
      </div>

      <div class="trip-id">
        Trip ID:
        <strong id="tripIdText">—</strong>
      </div>

    </div>

    <div class="gps-card">

      <div class="section-title">
        Live GPS Information
      </div>

      <div class="gps-grid">

        <div class="gps-item">
          <div class="gps-label">Latitude</div>
          <div class="gps-value" id="lat">—</div>
        </div>

        <div class="gps-item">
          <div class="gps-label">Longitude</div>
          <div class="gps-value" id="lng">—</div>
        </div>

        <div class="gps-item">
          <div class="gps-label">Accuracy</div>
          <div class="gps-value" id="accuracy">—</div>
        </div>

        <div class="gps-item">
          <div class="gps-label">Last Update</div>
          <div class="gps-value" id="lastUpdate">—</div>
        </div>

      </div>

    </div>

    <div class="gps-card">

      <div class="section-title">
        Location Sharing
      </div>

      <button
        id="stopButton"
        class="button stop-button"
        onclick="stopSharing()"
      >
        🛑 Stop Sharing Location
      </button>

      <div id="message" class="message"></div>

    </div>

    <div id="completedBox" class="completed-box">

      <div class="completed-icon">✅</div>

      <div class="completed-title">
        Trip Completed
      </div>

      <div class="completed-text">
        This trip has been completed by the administrator.
        GPS sharing has automatically stopped.
      </div>

    </div>

  </div>


  <script type="module">

    import {
      initializeApp
    } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";

    import {
      getDatabase,
      ref,
      update,
      onValue
    } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js";


    // =====================================================
    // FIREBASE CONFIG
    // =====================================================

    const firebaseConfig = {

      apiKey: "AIzaSyCEaUviM45cSPcs8Te6G0PqsE5imFR2TYE",

      authDomain: "yango-tracking.firebaseapp.com",

      projectId: "yango-tracking",

      storageBucket: "yango-tracking.firebasestorage.app",

      messagingSenderId: "1019473211995",

      appId: "1:1019473211995:web:56a81d2fc43cda8dd5857e",

      databaseURL:
        "https://yango-tracking-default-rtdb.asia-southeast1.firebasedatabase.app"

    };


    const app = initializeApp(firebaseConfig);

    const database = getDatabase(app);


    // =====================================================
    // TRIP ID
    // =====================================================

    const params = new URLSearchParams(window.location.search);

    const tripId = params.get("trip") || "demo";

    document.getElementById("tripIdText").textContent = tripId;


    // =====================================================
    // ELEMENTS
    // =====================================================

    const statusBadge =
      document.getElementById("statusBadge");

    const latElement =
      document.getElementById("lat");

    const lngElement =
      document.getElementById("lng");

    const accuracyElement =
      document.getElementById("accuracy");

    const lastUpdateElement =
      document.getElementById("lastUpdate");

    const stopButton =
      document.getElementById("stopButton");

    const messageElement =
      document.getElementById("message");

    const completedBox =
      document.getElementById("completedBox");


    // =====================================================
    // GPS VARIABLES
    // =====================================================

    let watchId = null;

    let sharingStoppedManually = false;

    let tripCompleted = false;


    // =====================================================
    // STATUS HELPERS
    // =====================================================

    function setStatus(text, type = "") {

      statusBadge.textContent = text;

      statusBadge.className = "status";

      if (type) {
        statusBadge.classList.add(type);
      }

    }


    function showMessage(text, type = "") {

      messageElement.textContent = text;

      messageElement.className = "message show";

      if (type) {
        messageElement.classList.add(type);
      }

    }


    // =====================================================
    // START GPS
    // =====================================================

    function startGPS() {

      if (!navigator.geolocation) {

        setStatus("GPS not supported", "stopped");

        showMessage(
          "This device/browser does not support GPS location.",
          "error"
        );

        return;
      }


      setStatus("Starting GPS…");


      watchId = navigator.geolocation.watchPosition(

        async (position) => {

          // If admin has already completed the trip,
          // don't send another GPS update.
          if (tripCompleted || sharingStoppedManually) {
            return;
          }


          const latitude =
            position.coords.latitude;

          const longitude =
            position.coords.longitude;

          const accuracy =
            position.coords.accuracy;

          const updatedAt =
            Date.now();


          // ---------------------------------------------
          // UPDATE SCREEN
          // ---------------------------------------------

          latElement.textContent =
            latitude.toFixed(6);

          lngElement.textContent =
            longitude.toFixed(6);

          accuracyElement.textContent =
            Math.round(accuracy) + " m";

          lastUpdateElement.textContent =
            new Date(updatedAt).toLocaleTimeString();


          // ---------------------------------------------
          // LIVE STATUS
          // ---------------------------------------------

          setStatus(
            "🟢 LIVE — GPS is being shared",
            "live"
          );


          // ---------------------------------------------
          // SEND REAL GPS TO FIREBASE
          // ---------------------------------------------

          try {

            await update(
              ref(database, "trips/" + tripId),
              {

                "location/lat":
                  latitude,

                "location/lng":
                  longitude,

                "location/accuracy":
                  accuracy,

                "location/updatedAt":
                  updatedAt,

                sharingActive:
                  true

              }
            );

          } catch (error) {

            console.error(
              "Firebase GPS update failed:",
              error
            );

            showMessage(
              "GPS is working, but the location could not be sent to the server.",
              "error"
            );

          }

        },

        (error) => {

          console.error(
            "GPS error:",
            error
          );


          if (error.code === 1) {

            setStatus(
              "GPS permission required",
              "stopped"
            );

            showMessage(
              "Please allow location access for this browser and try again.",
              "error"
            );

          } else if (error.code === 2) {

            setStatus(
              "GPS unavailable",
              "stopped"
            );

            showMessage(
              "Your phone could not determine its current location. Make sure Location/GPS is turned on.",
              "error"
            );

          } else if (error.code === 3) {

            setStatus(
              "GPS timeout",
              "stopped"
            );

            showMessage(
              "GPS took too long to respond. Keep Location/GPS enabled and try again.",
              "error"
            );

          } else {

            setStatus(
              "GPS error",
              "stopped"
            );

            showMessage(
              "Unable to get your current location.",
              "error"
            );

          }

        },

        {

          enableHighAccuracy: true,

          maximumAge: 3000,

          timeout: 15000

        }

      );

    }


    // =====================================================
    // STOP GPS
    // =====================================================

    async function stopSharing() {

      if (tripCompleted) {
        return;
      }


      const confirmed =
        confirm(
          "Are you sure you want to stop sharing your location?"
        );


      if (!confirmed) {
        return;
      }


      sharingStoppedManually = true;


      if (watchId !== null) {

        navigator.geolocation.clearWatch(
          watchId
        );

        watchId = null;

      }


      try {

        await update(
          ref(database, "trips/" + tripId),
          {

            sharingActive:
              false,

            sharingStoppedAt:
              Date.now()

          }
        );


        setStatus(
          "🛑 GPS sharing stopped",
          "stopped"
        );

        stopButton.disabled = true;

        showMessage(
          "Your location is no longer being shared.",
          "success"
        );


      } catch (error) {

        console.error(error);

        showMessage(
          "GPS stopped, but the server could not be updated.",
          "error"
        );

      }

    }


    // =====================================================
    // WATCH TRIP STATUS
    // =====================================================

    const tripRef =
      ref(database, "trips/" + tripId);


    onValue(

      tripRef,

      (snapshot) => {

        const trip =
          snapshot.val();


        if (!trip) {
          return;
        }


        // -------------------------------------------------
        // ADMIN COMPLETED THE RIDE
        // -------------------------------------------------

        if (
          trip.status === "Trip completed" &&
          !tripCompleted
        ) {

          tripCompleted = true;


          if (watchId !== null) {

            navigator.geolocation.clearWatch(
              watchId
            );

            watchId = null;

          }


          setStatus(
            "Trip completed",
            "completed"
          );


          stopButton.disabled = true;


          completedBox.classList.add(
            "show"
          );


          // Make sure the database reflects
          // that GPS sharing is no longer active.
          update(
            ref(database, "trips/" + tripId),
            {
              sharingActive: false
            }
          ).catch((error) => {

            console.error(
              "Could not update sharing status:",
              error
            );

          });

        }

      },

      (error) => {

        console.error(
          "Trip listener error:",
          error
        );

      }

    );


    // =====================================================
    // START
    // =====================================================

    startGPS();


    // Make stopSharing available to the button
    window.stopSharing = stopSharing;

  </script>

</body>
</html>
