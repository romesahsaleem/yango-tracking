<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Yango Tracking — Driver</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 430px;
      background: white;
      border-radius: 20px;
      padding: 25px;
      box-shadow: 0 5px 25px rgba(0,0,0,.12);
      text-align: center;
    }

    h1 {
      margin: 0;
      font-size: 24px;
    }

    .brand {
      color: #666;
      margin-top: 6px;
      margin-bottom: 25px;
      font-size: 14px;
    }

    .status {
      padding: 14px;
      border-radius: 10px;
      background: #f1f1f1;
      margin-bottom: 20px;
      font-weight: bold;
    }

    .live {
      background: #e8f8ee;
      color: #16723a;
    }

    .trip {
      background: #f7f7f7;
      padding: 14px;
      border-radius: 10px;
      margin-bottom: 20px;
    }

    .trip-label {
      color: #777;
      font-size: 12px;
      margin-bottom: 5px;
    }

    .trip-id {
      font-weight: bold;
      font-size: 18px;
    }

    .location {
      text-align: left;
      background: #fafafa;
      padding: 15px;
      border-radius: 10px;
      margin-top: 15px;
      line-height: 1.7;
      font-size: 14px;
    }

    button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 10px;
      background: #111;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }

    button:disabled {
      background: #aaa;
    }

    .note {
      color: #777;
      font-size: 12px;
      margin-top: 18px;
      line-height: 1.5;
    }
  </style>
</head>

<body>

  <div class="card">

    <h1>🚗 Driver GPS</h1>

    <div class="brand">
      Yango Tracking
    </div>

    <div id="status" class="status">
      GPS is not started
    </div>

    <div class="trip">

      <div class="trip-label">
        TRIP ID
      </div>

      <div id="tripId" class="trip-id">
        Loading...
      </div>

    </div>

    <button id="startBtn" onclick="startGPS()">
      Start Live GPS
    </button>

    <div class="location">

      <div>
        <strong>Latitude:</strong>
        <span id="lat">--</span>
      </div>

      <div>
        <strong>Longitude:</strong>
        <span id="lng">--</span>
      </div>

      <div>
        <strong>Accuracy:</strong>
        <span id="accuracy">--</span>
      </div>

    </div>

    <div class="note">
      Keep this page open while driving so your phone can
      continuously send its real GPS location.
    </div>

  </div>


  <script type="module">

    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";

    import {
      getDatabase,
      ref,
      set
    }
      from "https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js";


    /*
      KEEP THE SAME FIREBASE CONFIG
      FROM YOUR CURRENT WORKING DRIVER PAGE.
    */

    const firebaseConfig = {

      apiKey: "AIzaSyCEaUviM45cSPcs8Te6G0PqsE5imFR2TYE",

      authDomain: "yango-tracking.firebaseapp.com",

      projectId: "yango-tracking",

      storageBucket: "yango-tracking.firebasestorage.app",

      messagingSenderId: "1019473211995",

      appId: "1:1019473211995:web:56a81d2fc43cda8dd5857e",

      databaseURL:
        "https://yango-tracking-default-rtdb.asia-southeast1.firebasedatabase.app"

    };


    const app = initializeApp(firebaseConfig);

    const database = getDatabase(app);


    /*
      GET TRIP ID FROM URL
    */

    const params =
      new URLSearchParams(window.location.search);

    const tripId =
      params.get("trip") || "demo";


    document.getElementById("tripId").textContent =
      tripId;


    let watchId = null;


    /*
      START REAL GPS
    */

    window.startGPS = function() {

      if (!navigator.geolocation) {

        alert(
          "GPS is not supported on this device."
        );

        return;

      }


      document.getElementById("startBtn").disabled =
        true;


      document.getElementById("status").textContent =
        "🟡 Getting GPS location...";


      watchId =
        navigator.geolocation.watchPosition(

          async (position) => {

            const lat =
              position.coords.latitude;

            const lng =
              position.coords.longitude;

            const accuracy =
              position.coords.accuracy;


            document.getElementById("lat").textContent =
              lat.toFixed(6);

            document.getElementById("lng").textContent =
              lng.toFixed(6);

            document.getElementById("accuracy").textContent =
              Math.round(accuracy) + " m";


            try {

              await set(

                ref(
                  database,
                  "trips/" +
                  tripId +
                  "/location"
                ),

                {

                  lat: lat,

                  lng: lng,

                  accuracy: accuracy,

                  updatedAt: Date.now()

                }

              );


              document.getElementById("status").textContent =
                "🟢 LIVE — GPS is being shared";

              document.getElementById("status")
                .classList.add("live");


            } catch (error) {

              document.getElementById("status").textContent =
                "🔴 Firebase error";

              console.error(error);

            }

          },

          (error) => {

            document.getElementById("status").textContent =
              "🔴 GPS error: " + error.message;

            document.getElementById("startBtn").disabled =
              false;

          },

          {

            enableHighAccuracy: true,

            maximumAge: 3000,

            timeout: 15000

          }

        );

    };

  </script>

</body>
</html>
