<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>Yango Tracking</title>

<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<style>

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html,
body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  font-family: Arial, Helvetica, sans-serif;
  background: #ffffff;
  color: #111111;
}

/* =========================
   MAP
========================= */

#map {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 1;
}

/* =========================
   LOGO
========================= */

.logo {
  position: fixed;
  top: 28px;
  left: 28px;
  z-index: 1000;

  color: #e31837;

  font-size: 34px;
  font-weight: 900;
  letter-spacing: -2px;

  text-shadow:
    0 1px 2px rgba(255,255,255,.8);
}

/* =========================
   RECENTER BUTTON
========================= */

.location-btn {
  position: fixed;

  right: 22px;
  top: 28px;

  z-index: 1000;

  width: 56px;
  height: 56px;

  border: none;
  border-radius: 50%;

  background: #ffffff;

  box-shadow:
    0 4px 18px rgba(0,0,0,.18);

  display: flex;
  align-items: center;
  justify-content: center;

  cursor: pointer;
}

.location-btn svg {
  width: 28px;
  height: 28px;
}

/* =========================
   BOTTOM SHEET
========================= */

.bottom-sheet {
  position: fixed;

  left: 0;
  right: 0;
  bottom: 0;

  z-index: 900;

  background: #ffffff;

  border-radius: 26px 26px 0 0;

  box-shadow:
    0 -5px 25px rgba(0,0,0,.16);

  height: 57vh;

  min-height: 470px;

  max-height: 720px;

  overflow-y: auto;

  -webkit-overflow-scrolling: touch;

  scrollbar-width: none;
}

.bottom-sheet::-webkit-scrollbar {
  display: none;
}

/* =========================
   DRAG HANDLE
========================= */

.drag-area {
  width: 100%;

  height: 38px;

  display: flex;
  align-items: center;
  justify-content: center;
}

.drag-handle {
  width: 58px;
  height: 6px;

  background: #d0d0d0;

  border-radius: 20px;
}

/* =========================
   MAIN RIDE HEADER
========================= */

.ride-header {
  padding: 5px 30px 22px;

  border-bottom: 1px solid #eeeeee;
}

.status-title {
  font-size: 30px;

  font-weight: 800;

  line-height: 1.15;

  margin-bottom: 12px;
}

.vehicle-row {
  display: flex;
  align-items: center;

  gap: 10px;
}

.vehicle-name {
  font-size: 19px;

  color: #666666;

  font-weight: 700;
}

.plate-pill {
  background: #eeeeee;

  color: #222222;

  padding: 7px 12px;

  border-radius: 9px;

  font-size: 17px;

  font-weight: 800;

  letter-spacing: .5px;
}

/* =========================
   ETA
========================= */

.eta-row {
  padding: 14px 30px;

  color: #555555;

  font-size: 15px;

  font-weight: 600;
}

.eta-row strong {
  color: #111111;
}

/* =========================
   SECTION HEADER
========================= */

.section-header {
  background: #f5f5f5;

  padding: 18px 30px;

  border-top: 1px solid #eeeeee;
  border-bottom: 1px solid #eeeeee;

  font-size: 22px;

  font-weight: 800;
}

/* =========================
   RIDE DETAILS
========================= */

.route-details {
  padding: 28px 30px 30px;
}

.timeline {
  position: relative;
}

.timeline-line {
  position: absolute;

  left: 19px;

  top: 38px;

  bottom: 38px;

  width: 3px;

  background: #d5d5d5;
}

.timeline-item {
  position: relative;

  display: flex;

  align-items: center;

  min-height: 105px;
}

.timeline-circle {
  width: 40px;
  height: 40px;

  border-radius: 50%;

  display: flex;

  align-items: center;
  justify-content: center;

  flex-shrink: 0;

  z-index: 2;

  font-size: 19px;

  font-weight: 900;
}

.timeline-circle.pickup {
  background: #e31837;
  color: #ffffff;
}

.timeline-circle.dropoff {
  background: #111111;
  color: #ffffff;
}

.timeline-content {
  padding-left: 22px;
}

.timeline-label {
  color: #999999;

  font-size: 14px;

  font-weight: 500;

  text-transform: uppercase;

  letter-spacing: .4px;

  margin-bottom: 5px;
}

.timeline-location {
  font-size: 21px;

  font-weight: 800;

  line-height: 1.2;
}

/* =========================
   DRIVER SECTION
========================= */

.driver-section {
  border-top: 1px solid #eeeeee;
}

.driver-content {
  padding: 25px 30px 30px;
}

.driver-card {
  display: flex;

  align-items: center;

  gap: 18px;
}

.driver-photo {
  width: 72px;
  height: 72px;

  border-radius: 50%;

  object-fit: cover;

  background: #eeeeee;

  flex-shrink: 0;
}

.driver-info {
  min-width: 0;
}

.driver-name {
  font-size: 23px;

  font-weight: 800;

  margin-bottom: 6px;
}

.driver-rating {
  font-size: 15px;

  color: #555555;
}

.driver-rating .star {
  color: #f2a900;

  font-size: 17px;
}

.driver-rating-number {
  font-weight: 800;

  color: #222222;
}

/* =========================
   DRIVER VEHICLE INFO
========================= */

.driver-vehicle {
  margin-top: 20px;

  display: grid;

  grid-template-columns: 1fr 1fr;

  gap: 10px;
}

.vehicle-info-box {
  background: #f6f6f6;

  border-radius: 12px;

  padding: 14px;
}

.vehicle-info-label {
  color: #888888;

  font-size: 12px;

  text-transform: uppercase;

  margin-bottom: 5px;
}

.vehicle-info-value {
  font-size: 16px;

  font-weight: 800;
}

/* =========================
   SHARE
========================= */

.share-area {
  padding: 5px 30px 30px;
}

.share-btn {
  width: 100%;

  border: none;

  border-radius: 13px;

  background: #111111;

  color: #ffffff;

  padding: 16px;

  font-size: 17px;

  font-weight: 800;

  cursor: pointer;
}

.share-btn:active {
  transform: scale(.98);
}

/* =========================
   COMPLETED
========================= */

.completed-box {
  display: none;

  margin: 0 30px 20px;

  padding: 15px;

  border-radius: 12px;

  background: #fdf0f0;

  color: #a50e24;

  text-align: center;

  font-size: 15px;

  font-weight: 700;
}

.completed-box.show {
  display: block;
}

/* =========================
   MOBILE
========================= */

@media (max-width: 600px) {

  .logo {
    top: 25px;
    left: 24px;

    font-size: 32px;
  }

  .location-btn {
    top: 22px;
    right: 18px;

    width: 58px;
    height: 58px;
  }

  .bottom-sheet {
    height: 57vh;

    min-height: 465px;

    border-radius: 25px 25px 0 0;
  }

  .ride-header {
    padding-left: 30px;
    padding-right: 30px;
  }

  .status-title {
    font-size: 29px;
  }

  .vehicle-name {
    font-size: 18px;
  }

  .plate-pill {
    font-size: 16px;
  }

  .section-header {
    padding-left: 30px;
    padding-right: 30px;

    font-size: 21px;
  }

  .route-details {
    padding-left: 30px;
    padding-right: 30px;
  }

  .timeline-location {
    font-size: 20px;
  }

}

</style>
</head>

<body>

<div id="map"></div>

<div class="logo">

</div>

<button

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>


<script type="module">

/* =========================================================
   FIREBASE
========================================================= */

import {
  initializeApp
} from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";

import {
  getDatabase,
  ref,
  onValue
} from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js";


const firebaseConfig = {

  apiKey:
    "AIzaSyCEaUviM45cSPcs8Te6G0PqsE5imFR2TYE",,

  authDomain:
    "yango-tracking.firebaseapp.com",

  projectId:
    "yango-tracking",

  storageBucket:
    "yango-tracking.firebasestorage.app",

  messagingSenderId:
    "1019473211995",

  appId:
    "1:1019473211995:web:56a81d2fc43cda8dd5857e",

  databaseURL:
    "https://yango-tracking-default-rtdb.asia-southeast1.firebasedatabase.app"

};


const app =
  initializeApp(firebaseConfig);

const database =
  getDatabase(app);


/* =========================================================
   TRIP ID
   SUPPORTS:

   /route/demo/?lang=en

   /route/ABC123/?lang=en

   AND OLD:

   ?trip=demo
========================================================= */

const pathParts =
  window.location.pathname
    .split("/")
    .filter(Boolean);

let tripId =
  "demo";


const routeIndex =
  pathParts.indexOf("route");


if (
  routeIndex !== -1 &&
  pathParts[routeIndex + 1]
) {

  tripId =
    decodeURIComponent(
      pathParts[routeIndex + 1]
    );

}


/* Keep old ?trip= links working */

const params =
  new URLSearchParams(
    window.location.search
  );


if (
  params.get("trip")
) {

  tripId =
    params.get("trip");

}


/* =========================================================
   MAP
========================================================= */

const map =
  L.map(
    "map",
    {
      zoomControl: false,
      attributionControl: true
    }
  ).setView(
    [24.8607, 67.0011],
    13
  );


L.tileLayer(

  "https://tile.openstreetmap.org/{z}/{x}/{y}.png",

  {

    maxZoom: 19,

    attribution:
      '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank">OpenStreetMap contributors</a>'

  }

).addTo(map);


/* =========================================================
   VARIABLES
========================================================= */

let carMarker = null;

let pickupMarker = null;

let dropoffMarker = null;

let routeLine = null;

let innerRouteLine = null;

let currentDriverLocation = null;

let pickupLocation = null;

let dropoffLocation = null;

let firstLocation = true;

let currentStatus =
  "Driver is on the way";


/* =========================================================
   CAR ICON
========================================================= */

const carIcon =
  L.divIcon({

    className: "",

    html: `

      <div style="
        width:58px;
        height:58px;
        border-radius:50%;
        background:#fff;
        border:4px solid #e31837;
        display:flex;
        align-items:center;
        justify-content:center;
        box-shadow:0 4px 16px rgba(0,0,0,.25);
      ">

        <svg
          width="36"
          height="36"
          viewBox="0 0 64 64"
          fill="none"
        >

          <path
            d="M16 38L20 23C20.8 20 23 18 26 18H38C41 18 43.2 20 44 23L48 38"
            fill="#e31837"
          />

          <rect
            x="10"
            y="31"
            width="44"
            height="20"
            rx="6"
            fill="#e31837"
          />

          <rect
            x="21"
            y="22"
            width="22"
            height="11"
            rx="3"
            fill="white"
          />

          <circle
            cx="20"
            cy="49"
            r="5"
            fill="#111"
          />

          <circle
            cx="44"
            cy="49"
            r="5"
            fill="#111"
          />

          <rect
            x="14"
            y="37"
            width="7"
            height="4"
            rx="2"
            fill="white"
          />

          <rect
            x="43"
            y="37"
            width="7"
            height="4"
            rx="2"
            fill="white"
          />

        </svg>

      </div>

    `,

    iconSize:
      [58,58],

    iconAnchor:
      [29,29]

  });


/* =========================================================
   PICKUP ICON
========================================================= */

const pickupIcon =
  L.divIcon({

    className: "",

    html: `

      <div style="
        width:38px;
        height:38px;
        border-radius:50%;
        background:#e31837;
        color:white;
        display:flex;
        align-items:center;
        justify-content:center;
        font-weight:900;
        font-size:17px;
        box-shadow:0 3px 10px rgba(0,0,0,.25);
        border:3px solid white;
      ">
        P
      </div>

    `,

    iconSize:
      [38,38],

    iconAnchor:
      [19,19]

  });


/* =========================================================
   DROP OFF ICON
========================================================= */

const dropoffIcon =
  L.divIcon({

    className: "",

    html: `

      <div style="
        width:38px;
        height:38px;
        border-radius:50%;
        background:#111;
        color:white;
        display:flex;
        align-items:center;
        justify-content:center;
        font-weight:900;
        font-size:17px;
        box-shadow:0 3px 10px rgba(0,0,0,.25);
        border:3px solid white;
      ">
        D
      </div>

    `,

    iconSize:
      [38,38],

    iconAnchor:
      [19,19]

  });


/* =========================================================
   MOVE CAR
========================================================= */

function animateCarTo(
  lat,
  lng
) {

  currentDriverLocation =
    [lat, lng];


  if (!carMarker) {

    carMarker =
      L.marker(
        [lat, lng],
        {
          icon: carIcon,
          zIndexOffset: 1000
        }
      ).addTo(map);

    updateRoute();

    return;

  }


  const start =
    carMarker.getLatLng();

  const end =
    L.latLng(lat, lng);

  const duration =
    900;

  const startTime =
    performance.now();


  function animate(time) {

    const progress =
      Math.min(
        (time - startTime) /
        duration,
        1
      );


    const eased =
      progress *
      (2 - progress);


    const newLat =
      start.lat +
      (end.lat - start.lat) *
      eased;


    const newLng =
      start.lng +
      (end.lng - start.lng) *
      eased;


    carMarker.setLatLng(
      [newLat, newLng]
    );


    if (
      progress < 1
    ) {

      requestAnimationFrame(
        animate
      );

    } else {

      updateRoute();

    }

  }


  requestAnimationFrame(
    animate
  );

}


/* =========================================================
   PICKUP
========================================================= */

function setPickup(
  lat,
  lng
) {

  pickupLocation =
    [lat, lng];


  if (!pickupMarker) {

    pickupMarker =
      L.marker(
        [lat, lng],
        {
          icon: pickupIcon
        }
      ).addTo(map);

  } else {

    pickupMarker.setLatLng(
      [lat, lng]
    );

  }


  updateRoute();

}


/* =========================================================
   DROP OFF
========================================================= */

function setDropoff(
  lat,
  lng
) {

  dropoffLocation =
    [lat, lng];


  if (!dropoffMarker) {

    dropoffMarker =
      L.marker(
        [lat, lng],
        {
          icon: dropoffIcon
        }
      ).addTo(map);

  } else {

    dropoffMarker.setLatLng(
      [lat, lng]
    );

  }


  updateRoute();

}


/* =========================================================
   DISTANCE
========================================================= */

function distanceKm(
  lat1,
  lng1,
  lat2,
  lng2
) {

  const R =
    6371;


  const dLat =
    (lat2 - lat1) *
    Math.PI / 180;


  const dLng =
    (lng2 - lng1) *
    Math.PI / 180;


  const a =
    Math.sin(dLat / 2) ** 2 +

    Math.cos(
      lat1 *
      Math.PI / 180
    ) *

    Math.cos(
      lat2 *
      Math.PI / 180
    ) *

    Math.sin(dLng / 2) ** 2;


  const c =
    2 *
    Math.atan2(
      Math.sqrt(a),
      Math.sqrt(1 - a)
    );


  return R * c;

}


/* =========================================================
   ETA
========================================================= */

function updateETA() {

  const eta =
    document.getElementById(
      "etaText"
    );


  if (
    !currentDriverLocation
  ) {

    eta.textContent =
      "Driver is on the way";

    return;

  }


  let destination =
    null;


  if (
    currentStatus ===
    "Trip started"
  ) {

    destination =
      dropoffLocation;

  } else {

    destination =
      pickupLocation;

  }


  if (!destination) {

    eta.textContent =
      "Driver is on the way";

    return;

  }


  const distance =
    distanceKm(

      currentDriverLocation[0],

      currentDriverLocation[1],

      destination[0],

      destination[1]

    );


  const speed =
    currentStatus ===
    "Trip started"
      ? 30
      : 25;


  const minutes =
    Math.max(

      1,

      Math.round(
        distance /
        speed *
        60
      )

    );


  eta.innerHTML =
    `<strong>${minutes} min</strong> estimated arrival`;

}


/* =========================================================
   ROUTE
========================================================= */

async function updateRoute() {

  if (
    !currentDriverLocation
  ) {

    return;

  }


  let destination =
    null;


  if (
    currentStatus ===
    "Trip started"
  ) {

    destination =
      dropoffLocation;

  } else {

    destination =
      pickupLocation;

  }


  if (!destination) {

    return;

  }


  const from =
    currentDriverLocation;

  const to =
    destination;


  const url =
    `https://router.project-osrm.org/route/v1/driving/${from[1]},${from[0]};${to[1]},${to[0]}?overview=full&geometries=geojson`;


  try {

    const response =
      await fetch(url);


    const data =
      await response.json();


    if (
      !data.routes ||
      !data.routes.length
    ) {

      updateETA();

      return;

    }


    const coordinates =
      data.routes[0]
        .geometry
        .coordinates
        .map(
          point => [
            point[1],
            point[0]
          ]
        );


    /* Remove old route */

    if (routeLine) {

      map.removeLayer(
        routeLine
      );

      routeLine =
        null;

    }


    if (innerRouteLine) {

      map.removeLayer(
        innerRouteLine
      );

      innerRouteLine =
        null;

    }


    /* White outline */

    routeLine =
      L.polyline(
        coordinates,
        {
          color: "#ffffff",
          weight: 8,
          opacity: .95
        }
      ).addTo(map);


    /* Yellow route */

    innerRouteLine =
      L.polyline(
        coordinates,
        {
          color: "#f2c94c",
          weight: 4,
          opacity: 1
        }
      ).addTo(map);


    updateETA();

  }

  catch(error) {

    console.log(
      "Route unavailable",
      error
    );

    updateETA();

  }

}


/* =========================================================
   STATUS
========================================================= */

function updateStatus(
  status
) {

  currentStatus =
    status ||
    "Driver is on the way";


  const title =
    document.getElementById(
      "statusTitle"
    );


  const completed =
    document.getElementById(
      "completedBox"
    );


  if (
    currentStatus ===
    "Driver is on the way"
  ) {

    title.textContent =
      "Driver on the way";

  }

  else if (
    currentStatus ===
    "Driver arrived"
  ) {

    title.textContent =
      "Driver has arrived";

  }

  else if (
    currentStatus ===
    "Trip started"
  ) {

    title.textContent =
      "Trip in progress";

  }

  else if (
    currentStatus ===
    "Trip completed"
  ) {

    title.textContent =
      "Trip completed";

    completed.classList.add(
      "show"
    );

  }

  else {

    title.textContent =
      currentStatus;

  }


  if (
    currentStatus !==
    "Trip completed"
  ) {

    completed.classList.remove(
      "show"
    );

  }


  updateETA();

  updateRoute();

}


/* =========================================================
   DRIVER PHOTO FALLBACK
========================================================= */

function defaultDriverImage() {

  return (
    "data:image/svg+xml;charset=UTF-8," +

    encodeURIComponent(`

      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="100"
        height="100"
        viewBox="0 0 100 100"
      >

        <circle
          cx="50"
          cy="50"
          r="50"
          fill="#eeeeee"
        />

        <circle
          cx="50"
          cy="38"
          r="17"
          fill="#999999"
        />

        <path
          d="M20 88c4-20 18-30 30-30s26 10 30 30"
          fill="#999999"
        />

      </svg>

    `)
  );

}


/* =========================================================
   UPDATE DRIVER INFORMATION
========================================================= */

function updateInformation(
  trip
) {

  document.getElementById(
    "pickupText"
  ).textContent =
    trip.pickup ||
    "Pickup location";


  document.getElementById(
    "dropoffText"
  ).textContent =
    trip.dropoff ||
    "Drop-off location";


  document.getElementById(
    "driverName"
  ).textContent =
    trip.driverName ||
    "Driver";


  document.getElementById(
    "driverRating"
  ).textContent =
    trip.rating ||
    "5.0";


  const vehicle =
    trip.vehicle ||
    "Toyota Corolla";


  const plate =
    trip.plate ||
    "ABC-123";


  document.getElementById(
    "vehicleText"
  ).textContent =
    vehicle;


  document.getElementById(
    "vehicleText2"
  ).textContent =
    vehicle;


  document.getElementById(
    "plateText"
  ).textContent =
    plate;


  document.getElementById(
    "plateText2"
  ).textContent =
    plate;


  const photo =
    document.getElementById(
      "driverPhoto"
    );


  photo.src =
    trip.driverPhoto ||
    defaultDriverImage();

}


/* =========================================================
   FIREBASE REALTIME LISTENER
========================================================= */

const tripRef =
  ref(
    database,
    `trips/${tripId}`
  );


onValue(

  tripRef,

  snapshot => {

    const trip =
      snapshot.val();


    if (!trip) {

      document.getElementById(
        "statusTitle"
      ).textContent =
        "Trip not found";

      document.getElementById(
        "etaText"
      ).textContent =
        "This tracking link is unavailable";

      return;

    }


    updateInformation(
      trip
    );


    updateStatus(
      trip.status
    );


    /* PICKUP */

    if (
      trip.pickupLat != null &&
      trip.pickupLng != null
    ) {

      setPickup(

        Number(
          trip.pickupLat
        ),

        Number(
          trip.pickupLng
        )

      );

    }


    /* DROP OFF */

    if (
      trip.dropoffLat != null &&
      trip.dropoffLng != null
    ) {

      setDropoff(

        Number(
          trip.dropoffLat
        ),

        Number(
          trip.dropoffLng
        )

      );

    }


    /* DRIVER GPS */

    if (
      trip.location &&
      trip.location.lat != null &&
      trip.location.lng != null
    ) {

      const lat =
        Number(
          trip.location.lat
        );


      const lng =
        Number(
          trip.location.lng
        );


      if (
        !Number.isFinite(lat) ||
        !Number.isFinite(lng)
      ) {

        return;

      }


      if (
        firstLocation
      ) {

        firstLocation =
          false;


        currentDriverLocation =
          [lat, lng];


        carMarker =
          L.marker(

            [lat, lng],

            {
              icon: carIcon,
              zIndexOffset: 1000
            }

          ).addTo(map);


        map.setView(

          [lat, lng],

          15,

          {
            animate: true
          }

        );


        updateRoute();

      }

      else {

        animateCarTo(
          lat,
          lng
        );

      }

    }

  },

  error => {

    console.error(
      "Firebase tracking error:",
      error
    );

    document.getElementById(
      "statusTitle"
    ).textContent =
      "Unable to load trip";

    document.getElementById(
      "etaText"
    ).textContent =
      "Check your connection";

  }

);


/* =========================================================
   RECENTER
========================================================= */

document.getElementById(
  "locationBtn"
).addEventListener(

  "click",

  () => {

    if (
      currentDriverLocation
    ) {

      map.setView(

        currentDriverLocation,

        16,

        {
          animate: true
        }

      );

    }

  }

);


/* =========================================================
   SHARE
========================================================= */

document.getElementById(
  "shareBtn"
).addEventListener(

  "click",

  async () => {

    const shareUrl =
      window.location.href;


    if (
      navigator.share
    ) {

      try {

        await navigator.share({

          title:
            "Track my ride",

          text:
            "Track the driver's location in real time.",

          url:
            shareUrl

        });

      }

      catch(error) {

        console.log(
          "Share cancelled"
        );

      }

    }

    else {

      try {

        await navigator.clipboard.writeText(
          shareUrl
        );


        alert(
          "Tracking link copied!"
        );

      }

      catch(error) {

        prompt(
          "Copy this tracking link:",
          shareUrl
        );

      }

    }

  }

);


/* =========================================================
   MAP RESIZE
========================================================= */

setTimeout(

  () => {

    map.invalidateSize();

  },

  500

);


window.addEventListener(

  "resize",

  () => {

    map.invalidateSize();

  }

);

</script>
